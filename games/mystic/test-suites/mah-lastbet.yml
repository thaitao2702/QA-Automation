# Mystic — Last Bet (Mah_081, Mah_082, Mah_084, Mah_085) from test-case-mahjong.csv.
#
# Run:  python scripts/run_scenario.py --game mystic --env dev --suite games/mystic/test-suites/mah-lastbet.yml
# Validate (no browser):  python tests/chaos/validate_suites.py --game mystic
#
# ── WHY THIS FILE EXISTS ───────────────────────────────────────────────────────────────────
# `mah-history-lastbet.yml` parked Mah_081 / 082 / 084 and the post-bonus half of 085 as "not
# automatable": every one of them begins "Mở Last Bet", which was read as *open the Last Bet panel*,
# and this bridge exposes no `lastBet` button.
#
# **That reading was wrong. Last Bet is a RESUME behaviour, not a panel.** "Mở Last Bet" is *reopen
# the game*: the player closes it and comes back, and the session must show the round they last
# played — its stake, its win, its board — with the bet control sitting at that round's stake rather
# than at the configured default. No button is needed, which is why these cases are automatable after
# all. The client does it in `applyLastBet()` at Start, from `getGameInfo().lastBet`.
#
# Mah_087 STAYS in `mah-history-lastbet.yml`: that one really is about the auto-display (the panel
# flashes ~0.5s before each bonus round) and is graded on a high-fps clip. It is the only case in the
# module that is about the panel drawing itself.
#
# ⚠ THE TRAP. `applyLastBet()` nulls `gameInfo.lastBet` at Start on this client family, so a LIVE
# read reports "no last bet" on a session that restored perfectly. `getGameInfo()` must return the
# PRE-START CAPTURE, and `isGameInfoCaptured()` is what says it did.
# **Mystic's bridge doc does not document `isGameInfoCaptured()`** (Zeus's does). If this build lacks
# it the fact reads `None` — "the bridge cannot say" — exactly as measured on Chaos 2026-09-18. So
# the gate below is `!= False`: it fails when the bridge SAYS the capture is missing, and passes when
# it merely cannot answer, with `last_bet_present` carrying the real precondition.
#
# ── RESTORE vs RESUME ──────────────────────────────────────────────────────────────────────
# A reload with a bonus still OWED makes the client RESUME (`pending` drives it, never `lastBet`); a
# reload with nothing owed makes it RESTORE. One scenario each:
#   `last-bet-restore`               (Mah_081/082/084) plays any bonus out before reloading and
#                                    publishes `{facts.resumed_rounds}` — a case that resumed when it
#                                    meant to restore was grading the wrong screen, and says so.
#   `bonus-resume-denomination-swap` (Mah_085a/b) closes the game straight after a trigger, so the
#                                    reopen RESUMES; `{facts.is_pending_freespin}` is its gate.
#
# ⚠ CASCADES. Mystic resolves a round in STEPS: wins clear, symbols fall in, and the board settles
# several times before the round ends. "The final grid" in every prompt below means the board as it
# stands when the round has fully settled — the one the reopened game is compared against.
#
# ── HOW THE ASSERTS ARE SPLIT (Rule 10) ────────────────────────────────────────────────────
#   stream:  the game's own account of itself — exact values, and "it did not happen"
#   video:   what the player actually SEES — nothing in the response describes pixels
# Each clip runs `at: [played, restored]` (Mah_085: `[trigger, restored]`) and every prompt opens
# with `reload_visible`: no reload in the clip means no two phases to compare, and every other answer
# in the schema is meaningless.

runs:
  # ── Mah_081 : reopening after a LOSING round ───────────────────────────────────────────
  # "Hiển thị đúng Stake, Bet Amount, không có Win Line" — the stake comes back, and nothing claims a
  # win. On a cluster game the "win line" is the winning CLUSTER being marked.
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: lose, max_spins: 40 }
      cases:
        - id: Mah_081
          title: "Reopening the game after a losing round restores that round: its stake, and no win"
          assert:
            # THE GATES — see the file header for why this one is `!= False` and not `== True`.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"      # it RESTORED; it did not resume a bonus
            # The round really was a loss, so "no win is shown" is an expectation and not a
            # description of a round that happened to pay nothing anyway.
            - stream: "{facts.played_payout} == 0"
            - stream: "{facts.played_base_stake} > 0"
            # The case itself.
            - stream: "{facts.stake_restored} == True"
            - stream: "{facts.restored_payout} == 0"
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Mystic is a 7x7 cluster-pays slot: wins are CLUSTERS of touching symbols, which
                  clear and let new symbols fall in, so a round settles several times before it ends.
                  This clip has TWO PHASES separated by a game RELOAD, and the question is whether the
                  second matches the first. The ACTION TIMELINE gives the moment of the reload and the
                  moment the game came back ready — use it rather than guessing where the break is.

                  PHASE 1, before the reload: the player's last round, which LOST. Stake
                  {facts.played_base_stake}, win {facts.played_payout}. It is held on screen for a
                  few seconds once it has fully settled.

                  PHASE 2, after the reload: the game is closed and reopened, then sits ready for a
                  few seconds. It is expected to come back showing the SAME round.

                  Judge phase 2 against phase 1 and answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters? Answer false if no such break occurs.

                  (2) bet_amount_same: does the bet / stake readout after the reload show the same
                  value it showed before it? Judge the bet readout only — ignore the balance, which
                  moves for other reasons.

                  (3) no_win_after_reload: after the reload, is the screen free of any win
                  presentation — no win amount displayed, no cluster highlighted, no celebration —
                  matching the losing round in phase 1?

                  (4) symbols_same: look at the SYMBOLS ON THE BOARD, 7 by 7. After the reload, is
                  every position showing the SAME SYMBOL as the SETTLED board at the end of phase 1's
                  round — not an earlier cascade step? Compare cell by cell, not as an overall
                  impression.

                  (5) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_amount_same: { type: boolean }
                  no_win_after_reload: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_amount_same: true
                  no_win_after_reload: true
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── Mah_082 : reopening after a WINNING round ──────────────────────────────────────────
  # "Hiển thị đúng Win Line, Win Amount, Stake". A win gives the restore something to get WRONG, which
  # makes this the stronger of the pair.
  # ⚠ A cascade win pays across STEPS, and `{facts.played_payout}` is the ROUND's total — that is the
  # figure the reopened screen should show, not the last step's.
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: win, max_spins: 60 }
      cases:
        - id: Mah_082
          title: "Reopening the game after a winning round restores its stake, its win and its winning cluster"
          assert:
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"
            # This really was a win — otherwise every assert below is satisfied by a zero.
            - stream: "{facts.played_payout} > 0"
            - stream: "{facts.played_base_stake} > 0"
            # The case: the same stake AND the same money came back.
            - stream: "{facts.stake_restored} == True"
            - stream: "{facts.payout_restored} == True"
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - stream: conservation
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Mystic is a 7x7 cluster-pays slot: wins are CLUSTERS of touching symbols, which
                  clear and let new symbols fall in, so a round settles several times before it ends.
                  This clip has TWO PHASES separated by a game RELOAD. The ACTION TIMELINE gives the
                  moment of the reload and the moment the game came back ready.

                  PHASE 1, before the reload: the player's last round, which WON. Stake
                  {facts.played_base_stake}, total win for the round {facts.played_payout}. Watch it
                  resolve through its cascades, and note the win amount it ends on and which symbols
                  are marked as paying. The settled result is then held on screen for a few seconds.

                  PHASE 2, after the reload: the game is closed and reopened, then sits ready for a
                  few seconds. It is expected to come back showing the SAME round.

                  Judge phase 2 against phase 1 and answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters?

                  (2) bet_amount_same: does the bet / stake readout after the reload show the same
                  value it showed before it? Judge the bet readout only.

                  (3) win_amount_same: is the round's win displayed after the reload, and is it the
                  same figure phase 1 ended on ({facts.played_payout}) — the round's total, not one
                  cascade step's?

                  (4) win_cluster_same: after the reload, is the same winning combination marked as
                  in phase 1 — the same cluster of symbols highlighted?

                  (5) symbols_same: look at the SYMBOLS ON THE BOARD, 7 by 7. After the reload, is
                  every position showing the SAME SYMBOL as the SETTLED board at the end of phase 1's
                  round — not an earlier cascade step? Judge the symbols themselves here; whether the
                  cluster is marked on them is question (4).

                  (6) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_amount_same: { type: boolean }
                  win_amount_same: { type: boolean }
                  win_cluster_same: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_amount_same: true
                  win_amount_same: true
                  win_cluster_same: true
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── Mah_084 : changing the denomination after a round does not change what it reopens on ──
  # "Last Bet vẫn hiển thị Stake theo Denomination của lượt cược trước" — play at X, move the bet to
  # Y without spinning, reopen: it must come back on X. Changing the bet sends nothing to the server,
  # so the only record the reopened session has is `lastBet`, the round played at X.
  #
  # `bet_moved_after_round` is the gate — False when the bet list would not open, or the pick landed
  # back on X, in which case X and Y are the same number and the case would pass testing nothing.
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: any, change_bet_after: true, max_spins: 20 }
      cases:
        - id: Mah_084
          title: "After changing the denomination and reopening, the game shows the bet of the round played"
          assert:
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"
            - stream: "{facts.played_base_stake} > 0"
            # THE GATE FOR THIS CASE: the bet really moved to a different value (Y != X).
            - stream: "{facts.bet_moved_after_round} == True"
            - stream: "{facts.changed_bet_to} != {facts.played_base_stake}"
            # The case: the record is still the round played at X...
            - stream: "{facts.stake_restored} == True"
            # ...and the reopened game shows X, not Y. Two lines, because a readout showing some
            # third value fails the first and passes the second, and that is worth telling apart.
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - stream: "{facts.bet_opens_at_changed_value} == False"
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Mystic is a 7x7 cluster-pays slot. This clip has THREE PHASES. The ACTION TIMELINE
                  marks the bet change, the reload, and the moment the game came back ready — use it
                  rather than guessing where each phase begins.

                  PHASE 1: the player plays one round at a bet amount of
                  {facts.played_base_stake}, which is then held on screen for a few seconds once it
                  has settled. Note what the bet readout shows during that round.

                  PHASE 2: WITHOUT spinning again, the player opens the bet list and changes the bet
                  amount to {facts.changed_bet_to}. The readout now shows this second value.

                  PHASE 3: the game is closed and reopened, then sits ready for a few seconds.

                  The game is expected to come back on the bet amount of the round that was PLAYED —
                  phase 1's value, {facts.played_base_stake} — not on {facts.changed_bet_to}, which
                  was only selected. Answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters?

                  (2) bet_change_visible: between the round and the reload, does the bet readout
                  visibly change to a different value? Answer false if it never moves.

                  (3) bet_matches_played_round: after the reload, does the bet readout show the value
                  it showed in PHASE 1, while the round was being played?

                  (4) bet_matches_changed_value: after the reload, does it instead show the value it
                  showed in PHASE 2, after the change? Judge this against phase 2's screen
                  independently of your answer to (3) — if it shows some third figure, both are
                  false, and that is a meaningful answer.

                  (5) symbols_same: look at the SYMBOLS ON THE BOARD, 7 by 7. After the reload, is
                  every position showing the SAME SYMBOL as the settled board at the end of phase 1?
                  Changing the bet does not spin the reels, so the board should not have moved at all.

                  (6) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_change_visible: { type: boolean }
                  bet_matches_played_round: { type: boolean }
                  bet_matches_changed_value: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_change_visible: true
                  bet_matches_played_round: true
                  bet_matches_changed_value: false
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── Mah_085a + Mah_085b : pending free spins keep their stake; the default applies after ──
  # Mah_085 states both halves: *"Trong khi còn Pending FS vẫn hiển thị Stake của Free Spin. Sau khi
  # kết thúc mới hiển thị Stake mặc định."* One matrix row, two claims, so the ids carry a variant
  # suffix and both still count as Mah_085 in the coverage report.
  #
  #   1. trigger free spins at bet X
  #   2. CLOSE the game at once, while the bonus is still owed  (this is the "Mở Last Bet" reopen)
  #   3. change the agent's denomination on BO to a ladder that does NOT contain X
  #   4. reopen
  #   Mah_085a  the free spins RESUME and play out at X — the stake frozen when they triggered
  #   Mah_085b  once they end, the base game switches to the NEW ladder's DEFAULT bet
  #
  # ⚠ WHY THE DENOMINATION SWAP IS PART OF THIS CASE and not scope creep: without it, "Stake mặc
  # định" after the bonus may be the SAME number as the stake the bonus was played at, and the second
  # half passes without testing anything. Swapping to the automation ladder (11, 22, 33 — values no
  # real ladder uses) makes the two impossible to confuse, and `old_bet_on_new_ladder == False`
  # proves it on every run.
  #
  # ⚠ A RESUME, NOT A RESTORE: the reopen happens with a bonus OWED, so `pending` drives it — which
  # is why `is_pending_freespin` is the gate rather than `last_bet_present`.
  #
  # ⚠ MYSTIC SHARES ZEUS AND DRAGON'S CURRENCY (18) but is a different sub-category, so it has its
  # own (sub-category, currency) pair and its own "automation test <CUR> <SUBCAT>" ladder, created on
  # the first run. Creating one RESUBMITS THAT PAIR'S WHOLE LIST (docs/bo-denominations.md, trap 1) —
  # if that fails, read the error detail for the offending existing entry; it is not this case.
  #
  # ⚠ TEARDOWN IS NOT OPTIONAL (Rule 7): `reset-denomination` puts the agent row back, and re-raises
  # on failure so the suite stops rather than leaving every later bet assert measured against
  # 11/22/33. Trap 5 in docs/bo-denominations.md is why it restores the MASTER id.
  #
  # ⚠ RULE 20: the swap is not live when BO answers — it arrives on a Kafka event — so the scenario
  # waits 5s before reopening. The wait is never the evidence: `client_on_new_ladder` is.
  #
  # `max_win_x: 20` is the Rule 17 default for a bonus that can extend itself; `mystic-fs-easy`
  # triggers quickly and this bounds a cascade bonus that retriggers.
  - run:
      scenario: bonus-resume-denomination-swap
      paytable: { ref: mystic-fs-easy, max_win_x: 20 }
      teardown: [reset-denomination, return-to-base]
      params: { max_spins: 20, resume_cap: 60 }
      # ONE clip for both cases: the trigger, the close, the reopen, the resumed free spins, and the
      # base game after them. Each case grades the phase that is its claim (Rule 16).
      video:
        at: [trigger, restored]
        timestamp: true
        prompt: >-
          Mystic is a 7x7 cluster-pays slot with a free-spin bonus. This clip has FOUR PHASES. The
          ACTION TIMELINE marks the trigger, the close, the bet-ladder change, the reopen, and the
          return to the base game — use it rather than guessing where each phase begins.

          PHASE 1: a base spin at a bet amount of {facts.trigger_base_stake} triggers free spins.
          Note the bet readout and the free-spin count awarded.

          PHASE 2: the game is CLOSED (a blank or loading screen) while the bonus is still owed.
          While it is closed, the available bet amounts are changed in the back office to a
          completely different set, {facts.new_ladder}.

          PHASE 3: the game is reopened. The free spins are expected to CONTINUE where they left off
          and play to their end.

          PHASE 4: the bonus has ended and the game is back in the ordinary base game, sitting ready
          for a few seconds.

          Answer each question about the phase it names, independently:

          (1) reload_visible: does the clip actually contain the game closing and reopening — a blank
          or loading state, then the game again? Answer false if no such break occurs.

          (2) bonus_resumed: in PHASE 3, do the free spins continue playing, rather than the game
          reopening straight into the base game?

          (3) bet_during_bonus_is_old: during PHASE 3, does the bet readout show
          {facts.trigger_base_stake}, the bet amount from PHASE 1? Answer false if it shows anything
          else, or if no bet readout is visible during the bonus.

          (4) bet_during_bonus_is_new_value: during PHASE 3, does the bet readout instead show one of
          the new values, {facts.new_ladder}? Answer independently of (3).

          (5) back_to_base: in PHASE 4, is the game in the ordinary base game, ready to spin, with
          the bonus over?

          (6) bet_after_bonus_is_new_default: in PHASE 4, does the bet readout show
          {facts.new_default_bet}?

          (7) ui_broken: in PHASE 3 or PHASE 4, is anything overlapping, cut off, placeholder or
          visibly broken?
        output_schema:
          reload_visible: { type: boolean }
          bonus_resumed: { type: boolean }
          bet_during_bonus_is_old: { type: boolean }
          bet_during_bonus_is_new_value: { type: boolean }
          back_to_base: { type: boolean }
          bet_after_bonus_is_new_default: { type: boolean }
          ui_broken: { type: boolean }
          confidence: { type: string, enum: [high, medium, low] }
        expected_by_case:
          # ⚠ `bet_during_bonus_is_old` assumes this build SHOWS a bet readout during free spins. If
          # the first live run finds it hidden, this goes false on a healthy build: drop it from here
          # and let the stream half (`pending_stake_is_trigger`, `bet_during_bonus_is_old`) carry the
          # claim — those read the client's state whether or not it is drawn.
          Mah_085a:
            reload_visible: true
            bonus_resumed: true
            bet_during_bonus_is_old: true
            bet_during_bonus_is_new_value: false
            ui_broken: false
            confidence: medium
          Mah_085b:
            reload_visible: true
            back_to_base: true
            bet_after_bonus_is_new_default: true
            ui_broken: false
            confidence: medium
      cases:
        - id: Mah_085a
          title: "Free spins resumed after reopening play out at the stake they were triggered at"
          assert:
            # THE PREMISE: the ladder really changed, reached the client, and does not contain X.
            - stream: "{facts.swap_applied} == True"
            - stream: "{facts.client_on_new_ladder} == True"
            - stream: "{facts.old_bet_on_new_ladder} == False"
            - stream: "{facts.trigger_base_stake} > 0"
            # THE GATE: the reopen really resumed an owed bonus.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.is_pending_freespin} == True"
            # Rule 17: "the stake stayed X in every resumed round" needs more than one round.
            - stream: "{facts.resumed_rounds} >= 2"
            # THE CASE. The server froze X for the bonus...
            - stream: "{facts.pending_stake_is_trigger} == True"
            # ...and the client kept showing X in every resumed round, never a new-ladder value.
            - stream: "{facts.bet_during_bonus_is_old} == True"
            - stream: "{facts.bet_during_bonus_on_new_ladder} == False"
            # the resumed rounds were free and the bonus finished cleanly
            - stream: stake_zero_in_freespins
            - stream: terminal_reached
            - stream: conservation

        - id: Mah_085b
          title: "After the resumed free spins end, the bet returns to the default of the current denomination"
          assert:
            - stream: "{facts.swap_applied} == True"
            - stream: "{facts.client_on_new_ladder} == True"
            - stream: "{facts.old_bet_on_new_ladder} == False"
            # "after the bonus ends" presupposes one ran and ended
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.is_pending_freespin} == True"
            - stream: "{facts.resumed_rounds} >= 1"
            - stream: terminal_reached
            # THE CASE: the base game opens on the new ladder's default...
            - stream: "{facts.new_default_bet} != None"
            - stream: "{facts.bet_after_bonus_is_new_default} == True"
            # ...which is, necessarily, a value of the new ladder, not the old X.
            - stream: "{facts.bet_after_bonus_on_new_ladder} == True"

# ── NOT AUTOMATED ──────────────────────────────────────────────────────────────────────────
# Mah_083  Last Bet for a BOUGHT bonus. **NOT APPLICABLE** — this game does not support Buy Bonus
#          (`HAS_BUY_BONUS = False`; bridge-qa-api.md Gotchas: "the button exists but does nothing").
#          Dragon, Dragon VIP and Zeus carry the equivalent case.
#
# Mah_086  Last Bet of a PROMO round: the promo stake while the promo runs, and the default stake
#          once it ends. Needs a promo-provisioned player, the same blocker as Mah_074 … Mah_080.
#
# Mah_087  stays in `mah-history-lastbet.yml`. It is the one case in this module that IS about the
#          panel drawing itself — it flashes ~0.5s before each bonus round — and is graded there on a
#          high-fps clip, which the default sampling would miss entirely.
