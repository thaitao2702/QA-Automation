# env.config.local.yml — Mystic, LOCAL build.
#
# Runs a build you are serving yourself, against a REAL backend session.
#
# Why `base_url` and not `url`: only the backend can mint a launch token (it is signed, carries the
# session, currency and language, and expires). So the runner resolves a normal dev launch URL via
# `url_script`, takes its QUERY STRING — the `data=...` token blob — and hangs it off `base_url`:
#
#   base_url                 http://192.168.1.27:7459/web-mobile/sl_77_mystic_wishes/index.html
#   token from url_script    ?data=eyJhcGkiOiJodHRwczovL2Rldi1wbGF5...
#   launched                 http://192.168.1.27:7459/web-mobile/...?data=eyJhcGki...&bridge=1&debug=1
#
# So the CLIENT is your local build and the SERVER is dev. That is the point: you test local client
# changes without waiting on a deploy. The token's `server` / `staticUrl` fields still point at dev,
# so sockets, wallet and history all come from there.
#
# NOTE: this is a whole-origin swap, not `--base-url` on get_game_url_playsite.py — that flag keeps
# the backend's PATH (`/sl_77_mystic_wishes/index.html`) and would drop your `/web-mobile/...` prefix.

# The local build to test: scheme + host + port + path, no query.
base_url: "http://192.168.1.27:7459/web-mobile/sl_77_mystic_wishes/index.html"

# Where the launch token comes from. `token_env` names the .env overlay to load for the Playsite
# credentials (.env.dev), since .env.local has none of its own.
token_env: dev
url_script: "python scripts/get_game_url_playsite.py --env=dev"

browser_params: "?bridge=1&debug=1"

# Playsite launch (game-specific) — injected into url_script as PLAYSITE_GAME_CODE / _CURRENCY.
# A language run also injects PLAYSITE_LANGUAGE, so local runs can test i18n like any other env.
playsite:
  game_code: SL_77_MYSTIC_WISHES
  currency: TRY        # omit to use the player's default wallet

# Back-office identifiers for paytable control (bo_paytable_* steps). Same dev BO as the token.
bo:
  game_id: 256
  sas_entity_id: 1
  agent_id: 1
  currency_id: 18
  game_code: SL_77_MYSTIC_WISHES

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
