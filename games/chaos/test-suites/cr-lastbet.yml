# Chaos Runner — Last Bet (CR_092 … CR_097).
#
# Run:  python scripts/run_scenario.py --game chaos --env dev --suite games/chaos/test-suites/cr-lastbet.yml
# Validate (no browser):  python tests/chaos/validate_suites.py --game chaos
#
# The same rows Dragon runs as DR-53 … DR-59 and Dragon VIP as DV-67 … DV-73, on the same scenarios.
# Chaos is a 5x3 LINE game with 20 paylines and free spins — no Hold & Spin, no Buy Bonus — so the
# bonus cases here are free spins, and CR_094 does not apply at all (see the footer).
#
# ── WHAT "LAST BET" MEANS ──────────────────────────────────────────────────────────────────
# **It is a RESUME behaviour, not a panel.** The player closes the game and opens it again; the
# session must come back showing the round they last played — its stake, its win, its reels — and the
# bet control must sit at that round's stake rather than at the configured default. The CSV's
# "Mở Last Bet" is *reopen the game*, which is why CR_096 spells out "Reload game" as a step.
#
# ⚠⚠ WHAT THIS BUILD ACTUALLY EXPOSES — measured 2026-09-18, first run of CR_092.
# The restore cases read `getGameInfo().lastBet` (through the profile's parser). The Chaos bridge doc
# documents no `getGameInfo()` at all — `games/chaos/docs/raw/test-bridge-api.md` names
# `gameInfo.promo` and `gameInfo.betlines` in passing and nothing else — but the BUILD has it:
#
#   | | |
#   |---|---|
#   | `getGameInfo().lastBet` | **present** — `last_bet_present`, `stake_restored`, `restored_payout` and `bet_opens_at_last_stake` all passed |
#   | `isGameInfoCaptured()`  | **MISSING** — `info_captured` reads `None`, i.e. "the bridge cannot say". **A bridge gap to file**, not a game defect |
#   | `pending`               | unverified — CR_096 is the run that finds out (`is_pending_freespin`) |
#
# So the doc is behind the build, and one diagnostic is genuinely absent. The gates below are written
# for that: they fail when the bridge SAYS something is wrong, never when it merely cannot answer.
#
# The trap the capture flag exists for: `applyLastBet()` nulls `gameInfo.lastBet` at Start on the Zeus
# family, so a LIVE read reports "no last bet" on a session that restored perfectly. `getGameInfo()`
# must return the PRE-START CAPTURE. Without `isGameInfoCaptured()` this build cannot confirm it does
# — but `last_bet_present` passing is itself evidence the read was not a post-Start one.
#
# ── RESTORE vs RESUME ──────────────────────────────────────────────────────────────────────
# A reload with a bonus still OWED makes the client RESUME (`pending` drives it, never `lastBet`); a
# reload with nothing owed makes it RESTORE. Two scenarios, one per behaviour:
#   `last-bet-restore`               (CR_092/093/095) plays the bonus out before reloading and
#                                    publishes `{facts.resumed_rounds}` — a case that resumed when it
#                                    meant to restore was grading the wrong screen, and says so.
#   `bonus-resume-denomination-swap` (CR_096a/b) closes the game straight after a trigger, so the
#                                    reopen RESUMES; `{facts.is_pending_freespin}` is its gate.
#
# ── HOW THE ASSERTS ARE SPLIT (Rule 10) ────────────────────────────────────────────────────
#   stream:  the game's own account of itself — exact values, and "it did not happen"
#   video:   what the player actually SEES — nothing in the response describes pixels
#
# Each clip runs `at: [played, restored]` (CR_096: `[trigger, restored]`) — from the last round's
# response, through the reload, to the reopened game sitting ready. A still cannot hold a win
# presentation (the counter runs up, the payline is drawn and fades), and the question is not *what*
# the screen reads — the stream owns that — but whether it MATCHES what the player left. Every
# prompt opens with `reload_visible`: no reload in the clip means no two phases to compare, and every
# other answer in the schema is meaningless.

runs:
  # ── CR_092 : reopening after a LOSING round ────────────────────────────────────────────
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: lose, max_spins: 40 }
      cases:
        - id: CR_092
          title: "Reopening the game after a losing round restores that round: its stake, and no win"
          assert:
            # THE GATES — read the file header. Without these the comparisons below are
            # None == None, which greens on a build that restored nothing at all.
            # `!= False`, not `== True` — MEASURED on this build 2026-09-18. The Chaos bridge has
            # no `isGameInfoCaptured()`, so the fact is None ("the bridge cannot say"), and
            # `== True` red-failed a run whose restore was perfect. What this gate exists to
            # catch is a LIVE read reporting "no last bet" after `applyLastBet()` nulled it —
            # and `last_bet_present` below already disproves that whenever it passes. So it
            # fails only when the bridge SAYS the capture is missing, which stays dangerous.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"      # it RESTORED; it did not resume a bonus
            # The round really was a loss, so "no win is shown" is an expectation and not a
            # description of a round that happened to pay nothing anyway.
            - stream: "{facts.played_payout} == 0"
            - stream: "{facts.played_base_stake} > 0"
            # The case itself.
            - stream: "{facts.stake_restored} == True"
            - stream: "{facts.restored_payout} == 0"
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Chaos Runner is a 5x3 slot with 20 paylines. This clip has TWO PHASES separated by
                  a game RELOAD, and the question is whether the second matches the first. The ACTION
                  TIMELINE gives the moment of the reload and the moment the game came back ready —
                  use it rather than guessing where the break is.

                  PHASE 1, before the reload: the player's last round, which LOST. Stake
                  {facts.played_base_stake}, win {facts.played_payout}. It is held on screen for a
                  few seconds once it settles.

                  PHASE 2, after the reload: the game is closed and reopened, then sits ready for a
                  few seconds. It is expected to come back showing the SAME round.

                  Judge phase 2 against phase 1 and answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters? Answer false if no such break occurs.

                  (2) bet_amount_same: does the bet / stake readout after the reload show the same
                  value it showed before it? Judge the bet readout only — ignore the balance, which
                  moves for other reasons.

                  (3) no_win_after_reload: after the reload, is the screen free of any win
                  presentation — no win amount displayed, no payline highlighted, no celebration —
                  matching the losing round in phase 1?

                  (4) symbols_same: look at the SYMBOLS ON THE REELS. The grid is 5 reels by 3 rows,
                  so fifteen positions. After the reload, is every position showing the SAME SYMBOL
                  it showed in the final grid of phase 1's round? Compare cell by cell, not as an
                  overall impression. Answer false if any position holds a different symbol, or if
                  the grid came back as a fresh unrelated arrangement.

                  (5) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_amount_same: { type: boolean }
                  no_win_after_reload: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_amount_same: true
                  no_win_after_reload: true
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── CR_093 : reopening after a WINNING round ───────────────────────────────────────────
  # The stronger of the pair: a win gives the restore something to get WRONG.
  # ⚠ `outcome: win` HUNTS for a paying round at natural odds. On a 20-payline game a small win
  # arrives quickly, but if `{facts.spins_played}` ever climbs near `max_spins` the run is paying
  # real spins for it — force a win with `paytable: { ref: chaos-p1-ways }` instead (Rule 17).
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: win, max_spins: 60 }
      cases:
        - id: CR_093
          title: "Reopening the game after a winning round restores its stake, its win and its winning line"
          assert:
            # `!= False`, not `== True` — MEASURED on this build 2026-09-18. The Chaos bridge has
            # no `isGameInfoCaptured()`, so the fact is None ("the bridge cannot say"), and
            # `== True` red-failed a run whose restore was perfect. What this gate exists to
            # catch is a LIVE read reporting "no last bet" after `applyLastBet()` nulled it —
            # and `last_bet_present` below already disproves that whenever it passes. So it
            # fails only when the bridge SAYS the capture is missing, which stays dangerous.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"
            # This really was a win — otherwise every assert below is satisfied by a zero.
            - stream: "{facts.played_payout} > 0"
            - stream: "{facts.played_base_stake} > 0"
            # The case: the same stake AND the same money came back.
            - stream: "{facts.stake_restored} == True"
            - stream: "{facts.payout_restored} == True"
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - stream: conservation
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Chaos Runner is a 5x3 slot with 20 paylines. This clip has TWO PHASES separated by
                  a game RELOAD, and the question is whether the second matches the first. The ACTION
                  TIMELINE gives the moment of the reload and the moment the game came back ready.

                  PHASE 1, before the reload: the player's last round, which WON. Stake
                  {facts.played_base_stake}, win {facts.played_payout}. Watch it resolve, and note
                  the win amount it displays and which symbols or payline are marked as paying. The
                  settled result is then held on screen for a few seconds.

                  PHASE 2, after the reload: the game is closed and reopened, then sits ready for a
                  few seconds. It is expected to come back showing the SAME round.

                  Judge phase 2 against phase 1 and answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters?

                  (2) bet_amount_same: does the bet / stake readout after the reload show the same
                  value it showed before it? Judge the bet readout only.

                  (3) win_amount_same: is the round's win displayed after the reload, and is it the
                  same figure that was shown in phase 1?

                  (4) win_line_same: after the reload, is the same winning combination marked as in
                  phase 1 — the same symbols highlighted, or the same payline drawn or numbered?

                  (5) symbols_same: look at the SYMBOLS ON THE REELS — 5 reels by 3 rows, fifteen
                  positions. After the reload, is every position showing the SAME SYMBOL it showed in
                  the final grid of phase 1's round? Compare cell by cell. Judge the symbols
                  themselves here — whether the winning line is marked on them is question (4).

                  (6) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_amount_same: { type: boolean }
                  win_amount_same: { type: boolean }
                  win_line_same: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_amount_same: true
                  win_amount_same: true
                  win_line_same: true
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── CR_095 : changing the bet amount after a round does not change what the game reopens on ──
  # Play one round at bet X, change the bet to Y in the bet list (no spin), reopen. It must come back
  # on X: changing the bet sends nothing to the server, so the only record the reopened session has
  # is `lastBet`, the round played at X.
  #
  # `bet_moved_after_round` is the gate — False when the bet list would not open, or the pick landed
  # back on X, in which case X and Y are the same number and the case would pass testing nothing.
  # ⚠ Chaos's denomination rows are `bet:row:<i>` through the bridge's alias table (its own spelling
  # is `denomination:row:<i>`), the list scrolls, and the CURRENT row is non-interactable — the
  # scenario scrolls the row into view and picks by VALUE for exactly that reason.
  - run:
      scenario: last-bet-restore
      teardown: return-to-base
      params: { outcome: any, change_bet_after: true, max_spins: 20 }
      cases:
        - id: CR_095
          title: "After changing the bet amount and reopening, the game shows the bet of the round played"
          assert:
            # `!= False`, not `== True` — MEASURED on this build 2026-09-18. The Chaos bridge has
            # no `isGameInfoCaptured()`, so the fact is None ("the bridge cannot say"), and
            # `== True` red-failed a run whose restore was perfect. What this gate exists to
            # catch is a LIVE read reporting "no last bet" after `applyLastBet()` nulled it —
            # and `last_bet_present` below already disproves that whenever it passes. So it
            # fails only when the bridge SAYS the capture is missing, which stays dangerous.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.last_bet_present} == True"
            - stream: "{facts.resumed_rounds} == 0"
            - stream: "{facts.played_base_stake} > 0"
            # THE GATE FOR THIS CASE: the bet really moved to a different value (Y != X).
            - stream: "{facts.bet_moved_after_round} == True"
            - stream: "{facts.changed_bet_to} != {facts.played_base_stake}"
            # The case: the record is still the round played at X...
            - stream: "{facts.stake_restored} == True"
            # ...and the reopened game shows X, not Y. Two lines, because a readout showing some
            # third value fails the first and passes the second, and that is worth telling apart.
            - stream: "{facts.bet_opens_at_last_stake} == True"
            - stream: "{facts.bet_opens_at_changed_value} == False"
            - video:
                at: [played, restored]
                timestamp: true
                prompt: >-
                  Chaos Runner is a 5x3 slot with 20 paylines. This clip has THREE PHASES. The ACTION
                  TIMELINE marks the bet change, the reload, and the moment the game came back ready
                  — use it rather than guessing where each phase begins.

                  PHASE 1: the player plays one round at a bet amount of
                  {facts.played_base_stake}, which is then held on screen for a few seconds. Note
                  what the bet readout shows during that round.

                  PHASE 2: WITHOUT spinning again, the player opens the bet list and changes the bet
                  amount to {facts.changed_bet_to}. The readout now shows this second value.

                  PHASE 3: the game is closed and reopened, then sits ready for a few seconds.

                  The game is expected to come back on the bet amount of the round that was PLAYED —
                  phase 1's value, {facts.played_base_stake} — not on {facts.changed_bet_to}, which
                  was only selected. Answer each independently:

                  (1) reload_visible: does the clip actually contain a reload — the game goes to a
                  loading or blank state and then re-enters?

                  (2) bet_change_visible: between the round and the reload, does the bet readout
                  visibly change to a different value? Answer false if it never moves.

                  (3) bet_matches_played_round: after the reload, does the bet readout show the value
                  it showed in PHASE 1, while the round was being played?

                  (4) bet_matches_changed_value: after the reload, does it instead show the value it
                  showed in PHASE 2, after the change? Judge this against phase 2's screen
                  independently of your answer to (3) — if it shows some third figure, both are
                  false, and that is a meaningful answer.

                  (5) symbols_same: look at the SYMBOLS ON THE REELS — 5 reels by 3 rows. After the
                  reload, is every position showing the SAME SYMBOL it showed in the final grid of
                  phase 1's round? Changing the bet does not spin the reels, so the grid should not
                  have moved at all.

                  (6) ui_broken: after the reload, is anything overlapping, cut off, placeholder or
                  visibly broken?
                output_schema:
                  reload_visible: { type: boolean }
                  bet_change_visible: { type: boolean }
                  bet_matches_played_round: { type: boolean }
                  bet_matches_changed_value: { type: boolean }
                  symbols_same: { type: boolean }
                  ui_broken: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected:
                  reload_visible: true
                  bet_change_visible: true
                  bet_matches_played_round: true
                  bet_matches_changed_value: false
                  symbols_same: true
                  ui_broken: false
                  confidence: medium

  # ── CR_096a + CR_096b : the denomination changes on BO while free spins are still owed ──
  # CR_096 as two cases on ONE run (Rule 16) — one matrix row, two claims, so the ids carry a
  # variant suffix and both still count as CR_096 in the coverage report:
  #   1. trigger free spins at bet X
  #   2. CLOSE the game at once, while the bonus is still owed
  #   3. change the agent's denomination on BO to a ladder that does NOT contain X
  #   4. reopen
  #   CR_096a  the free spins RESUME and play out at X, the stake frozen when they triggered
  #   CR_096b  once they end, the base game switches to the NEW ladder's DEFAULT bet
  #
  # ⚠ A RESUME, NOT A RESTORE: the reopen happens with a bonus OWED, so `pending` drives it — which
  # is why `is_pending_freespin` is the gate. **Chaos's bridge doc documents no `pending`** (see the
  # file header): if this reports unreached, that is the first thing to check.
  #
  # ⚠ THE NEW LADDER MUST NOT CONTAIN X, or "the bonus kept X" and "the new ladder applied" look the
  # same. The swap goes to the automation ladder (11, 22, 33), which shares no value with any real
  # ladder, and `old_bet_on_new_ladder == False` proves it on every run.
  #
  # ⚠ CHAOS HAS ITS OWN BO PAIR. A denomination belongs to a (sub-category, currency) pair, and
  # Chaos is 5x3 where Dragon VIP is 3x3 — so "automation test <CUR> <SUBCAT>" for THIS pair probably
  # does not exist yet and the first run creates it. Creating one RESUBMITS THAT PAIR'S WHOLE LIST
  # (docs/bo-denominations.md, trap 1), and on the TKN 3x3 pair that came back VALIDATION_FAILED
  # because an existing ladder in the list was itself invalid. If it fails here too, read the error
  # detail for the offending entry — it is not this case.
  #
  # ⚠ TEARDOWN IS NOT OPTIONAL (Rule 7): `reset-denomination` puts the agent row back, and re-raises
  # on failure so the suite stops rather than leaving every later bet assert measured against
  # 11/22/33. Trap 5 in docs/bo-denominations.md is why it restores the MASTER id, not "the previous
  # one".
  #
  # ⚠ RULE 20 — the swap is not live when BO answers. BO publishes it on a Kafka event and the game
  # server applies it when that lands, so the scenario waits 5s before reopening. The wait is never
  # the evidence: `client_on_new_ladder` is, and both cases gate on it.
  #
  # DETERMINISTIC: `chaos-fs-easy` triggers on spin 1 and always awards the SHORTEST bonus — 12 free
  # spins from 3 reels — so the resumed bonus is the same length every run.
  #
  # ⚠ `max_win_x: 20` is the Rule 17 DEFAULT for a bonus that can extend itself: 20x the bet the
  # runner reads off the OPEN game (not `bo.reference_bet` — that is only the fallback when the live read fails). It bounds a
  # 12-spin bonus that could otherwise run long, but a cap this tight CAN END THE BONUS EARLY: the
  # server truncates at it and sets `hasReachedMaxWin`, which the framework treats as terminal
  # (Rule 9). Two ways that shows up here, and neither is a game defect:
  #   * the bonus truncates after one resumed round -> `{facts.resumed_rounds} >= 2` fails. The
  #     claim needs two rounds to mean "the bet stayed X", so the honest fix is a LOOSER cap, never a
  #     lower floor.
  #   * the TRIGGER itself hits the cap -> the bonus ends before the game is closed, nothing is owed,
  #     and `{facts.is_pending_freespin}` is False: the run reports unreached, which is correct —
  #     there was no resume to grade.
  # Raise it back toward 500 if either shows up; the cases are about the STAKE, not the payout.
  - run:
      scenario: bonus-resume-denomination-swap
      paytable: { ref: chaos-fs-easy, max_win_x: "10 * bet" }
      teardown: [reset-denomination, return-to-base]
      params: { max_spins: 10, resume_cap: 60 }
      # ONE clip for both cases: the trigger, the close, the reopen, the resumed free spins, and the
      # base game after them. Each case grades the phase that is its claim.
      video:
        at: [trigger, restored]
        timestamp: true
        prompt: >-
          Chaos Runner is a 5x3 slot with 20 paylines and a free-spin bonus. This clip has FOUR
          PHASES. The ACTION TIMELINE marks the trigger, the close, the bet-ladder change, the
          reopen, and the return to the base game — use it rather than guessing where each phase
          begins.

          PHASE 1: a base spin at a bet amount of {facts.trigger_base_stake} triggers free spins.
          Note the bet readout and the free-spin count awarded.

          PHASE 2: the game is CLOSED (a blank or loading screen) while the bonus is still owed.
          While it is closed, the available bet amounts are changed in the back office to a
          completely different set, {facts.new_ladder}.

          PHASE 3: the game is reopened. The free spins are expected to CONTINUE where they left off
          and play to their end.

          PHASE 4: the bonus has ended and the game is back in the ordinary base game, sitting ready
          for a few seconds.

          Answer each question about the phase it names, independently:

          (1) reload_visible: does the clip actually contain the game closing and reopening — a blank
          or loading state, then the game again? Answer false if no such break occurs.

          (2) bonus_resumed: in PHASE 3, do the free spins continue playing, rather than the game
          reopening straight into the base game?

          (3) bet_during_bonus_is_old: during PHASE 3, does the bet readout show
          {facts.trigger_base_stake}, the bet amount from PHASE 1? Answer false if it shows anything
          else, or if no bet readout is visible during the bonus.

          (4) bet_during_bonus_is_new_value: during PHASE 3, does the bet readout instead show one of
          the new values, {facts.new_ladder}? Answer independently of (3).

          (5) back_to_base: in PHASE 4, is the game in the ordinary base game, ready to spin, with
          the bonus over?

          (6) bet_after_bonus_is_new_default: in PHASE 4, does the bet readout show
          {facts.new_default_bet}?

          (7) ui_broken: in PHASE 3 or PHASE 4, is anything overlapping, cut off, placeholder or
          visibly broken?
        output_schema:
          reload_visible: { type: boolean }
          bonus_resumed: { type: boolean }
          bet_during_bonus_is_old: { type: boolean }
          bet_during_bonus_is_new_value: { type: boolean }
          back_to_base: { type: boolean }
          bet_after_bonus_is_new_default: { type: boolean }
          ui_broken: { type: boolean }
          confidence: { type: string, enum: [high, medium, low] }
        expected_by_case:
          # ⚠ `bet_during_bonus_is_old` assumes this build SHOWS a bet readout during free spins.
          # If the first live run finds it hidden, this goes false on a healthy build: drop it from
          # here and let the stream half (`pending_stake_is_trigger`, `bet_during_bonus_is_old`)
          # carry the claim — those read the client's state whether or not it is drawn.
          CR_096a:
            reload_visible: true
            bonus_resumed: true
            bet_during_bonus_is_old: true
            bet_during_bonus_is_new_value: false
            ui_broken: false
            confidence: medium
          CR_096b:
            reload_visible: true
            back_to_base: true
            bet_after_bonus_is_new_default: true
            ui_broken: false
            confidence: medium
      cases:
        - id: CR_096a
          title: "Free spins resumed after a BO denomination change play out at the bet they triggered at"
          assert:
            # THE PREMISE: the ladder really changed, reached the client, and does not contain X.
            - stream: "{facts.swap_applied} == True"
            - stream: "{facts.client_on_new_ladder} == True"
            - stream: "{facts.old_bet_on_new_ladder} == False"
            - stream: "{facts.trigger_base_stake} > 0"
            # THE GATE: the reopen really resumed an owed bonus.
            # `!= False`, not `== True` — MEASURED on this build 2026-09-18. The Chaos bridge has
            # no `isGameInfoCaptured()`, so the fact is None ("the bridge cannot say"), and
            # `== True` red-failed a run whose restore was perfect. What this gate exists to
            # catch is a LIVE read reporting "no last bet" after `applyLastBet()` nulled it —
            # and `last_bet_present` below already disproves that whenever it passes. So it
            # fails only when the bridge SAYS the capture is missing, which stays dangerous.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.is_pending_freespin} == True"
            # Rule 17: "the bet stayed X in every resumed round" needs more than one round. The
            # fixture awards 12, and the close comes before the client fires the first.
            - stream: "{facts.resumed_rounds} >= 2"
            # THE CASE. The server froze X for the bonus...
            - stream: "{facts.pending_stake_is_trigger} == True"
            # ...and the client kept showing X in every resumed round, never a new-ladder value.
            - stream: "{facts.bet_during_bonus_is_old} == True"
            - stream: "{facts.bet_during_bonus_on_new_ladder} == False"
            # the resumed rounds were free and the bonus finished cleanly
            - stream: stake_zero_in_freespins
            - stream: terminal_reached
            - stream: conservation

        - id: CR_096b
          title: "After the resumed free spins end, the bet switches to the new denomination's default"
          assert:
            - stream: "{facts.swap_applied} == True"
            - stream: "{facts.client_on_new_ladder} == True"
            - stream: "{facts.old_bet_on_new_ladder} == False"
            # "after the bonus ends" presupposes one ran and ended
            # `!= False`, not `== True` — MEASURED on this build 2026-09-18. The Chaos bridge has
            # no `isGameInfoCaptured()`, so the fact is None ("the bridge cannot say"), and
            # `== True` red-failed a run whose restore was perfect. What this gate exists to
            # catch is a LIVE read reporting "no last bet" after `applyLastBet()` nulled it —
            # and `last_bet_present` below already disproves that whenever it passes. So it
            # fails only when the bridge SAYS the capture is missing, which stays dangerous.
            - stream: "{facts.info_captured} != False"
            - stream: "{facts.is_pending_freespin} == True"
            - stream: "{facts.resumed_rounds} >= 1"
            - stream: terminal_reached
            # THE CASE: the base game opens on the new ladder's default...
            - stream: "{facts.new_default_bet} != None"
            - stream: "{facts.bet_after_bonus_is_new_default} == True"
            # ...which is, necessarily, a value of the new ladder, not the old X.
            - stream: "{facts.bet_after_bonus_on_new_ladder} == True"

