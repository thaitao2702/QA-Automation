ui_elements:
  # Sourced from test-bridge-api.md (Control names, CAPABILITIES) and the design doc's
  # Features sections. No UI reference images have been captured yet.

  multiplier_bar:
    file: ui/multiplier_bar.png       # image not yet added — drop the reference image here for AI assertions
    name: "Multiplier Ladder"
    type: ui
    description: "The lucky-multiplier ladder (x1, x2, x5, x10) rendered by MulitplierBarView; bridge HAS_MULTIPLIER_LADDER=true, values readable via getMultiplierLevels(). Illustrated by embedded image13/image14 (Features §2)."

  ante_bet_button:
    file: ui/ante_bet_button.png      # image not yet added — drop the reference image here for AI assertions
    name: "Ante Bet Button"
    type: ui
    description: "btn_anteBet; bridge control names `anteBet` and `anteBetInfoClose`. Activating it multiplies the deducted/displayed bet amount by 3 (QA-confirmed) while payouts still derive from the unchanged base bet."

  spin_button:
    file: ui/spin_button.png          # image not yet added — drop the reference image here for AI assertions
    name: "Spin Button"
    type: ui
    description: "Bridge control `spin`; gated by waitForSpinClickable()'s settle contract. Also supports a press-and-hold gesture via holdSpinStart()/holdSpinEnd() (not a Hold & Spin bonus)."

  turbo_button:
    file: ui/turbo_button.png         # image not yet added — drop the reference image here for AI assertions
    name: "Turbo Button"
    type: ui
    description: "btn_turbo; bridge control `turbo`, also `setting:turbo` / `setting:turboTab`. Speed state readable via getSpeedMode()."

  autoplay_button:
    file: ui/autoplay_button.png      # image not yet added — drop the reference image here for AI assertions
    name: "Autoplay Button"
    type: ui
    description: "btn_autoplay; opens the autoplay popup exposing confirm/stop/cancel/next/back/stopAtWin/close/count:<i>."

  free_spin_counter:
    file: ui/free_spin_counter.png    # image not yet added — drop the reference image here for AI assertions
    name: "Free Spin Counter"
    type: ui
    description: "Remaining free-spin display during the bonus round. Not described in the design doc; shape assumed from shared-mechanisms/free-spin.md. Verify against a real build."

  reel_glow:
    file: ui/reel_glow.png            # image not yet added — drop the reference image here for AI assertions
    name: "Reel Glow"
    type: ui
    description: "Anticipation glow effect (Features §5). Case 1: 2 Bonus icons on different reels glow the other reels. Case 2: P1 on reels 1 and 3 glows reel 5."

  raining_wild:
    file: ui/raining_wild.png         # image not yet added — drop the reference image here for AI assertions
    name: "Raining Wild Animation"
    type: ui
    description: "Plays while the reels are still spinning when the result contains 2+ Wilds (100%; 0% below 2). VISUAL ONLY — does not alter the mathematical outcome (Features §1). Illustrated by embedded image11/image12."

  win_tier_popup:
    file: ui/win_tier_popup.png       # image not yet added — drop the reference image here for AI assertions
    name: "Big Win Celebration"
    type: ui
    description: "Win-tier celebration (Slim/Small/Medium/Big/Mega/Ultra, Features §8). Skipped via skipBigWin() — it is a tap-anywhere Canvas listener, not a button, so it has no rect."
