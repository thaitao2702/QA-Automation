# assets.yml — chaos (Chaos Runner) asset manifest
# Generated by init-knowledge on 2026-08-24
# Keys are the ref_asset names used in test YAML; `file:` is relative to docs/assets/.
#
# Source: games/chaos/docs/raw/19_Chaos_runner.md ("Symbols Mapping" table, lines 5-16)
# and test-bridge-api.md (control names / popup labels for the UI entries).
#
# NOTE: no image files have been added yet. The design doc embeds all 15 images as base64
# data URIs (image1-image10 are the 10 symbols, in the STT order below); they have NOT been
# extracted. Only assets whose `file:` exists on disk are loaded into the AI reference pack
# at runtime, so every entry below is currently inert.
# Symbol name mapping: `name` is the in-game UI name (doc "MAPPING" column); the key and
# `math_name` use the math-model name (doc "NAME" column).

symbols:
  wild:
    file: symbols/Wild.png            # image not yet added — drop the reference image here for AI assertions
    name: "Wild"
    math_name: "Wild"
    type: wild
    description: "STT 01. Type 'Substitution'. Substitutes for any symbol except Bonus(Freespin) and P1 (19_Chaos_runner.md, Game Rules). Two or more Wilds in a result trigger the Raining Wild animation at 100% (Features §1)."

  freespin:
    file: symbols/FreeSpin.png        # image not yet added — drop the reference image here for AI assertions
    name: "Bonus"
    math_name: "FreeSpin"
    type: scatter
    description: "STT 02. Type 'Scatter (Exclude wild)' — Wild cannot substitute for it. Pays from any reel. 3/4/5 symbols award 12/15/20 free spins (QA-confirmed 2026-08-24). Two on different reels trigger Reel Glow on the other reels (Features §5)."

  p1:
    file: symbols/P1_Fuel.png         # image not yet added — drop the reference image here for AI assertions
    name: "Fuel"
    math_name: "P1"
    type: normal
    description: "STT 03. Type 'Normal (Exclude wild)' — Wild cannot substitute for it (QA-confirmed: Fuel, Normal type, not 'Gun'/Scatter as Features §5 Case 2 mistakenly says). Appears only on reels 1, 3, 5. Ways-evaluated, pays from any reel, 10x bet per way (Features §4)."

  p2:
    file: symbols/P2_Can.png          # image not yet added — drop the reference image here for AI assertions
    name: "can"
    math_name: "P2"
    type: high
    description: "STT 04. Type 'Normal (Include wild)'. The only symbol with a documented line multiplier: 'Icon Multi P2 : 200' for 3 of a kind (Game Logic worked example)."

  p3:
    file: symbols/P3_Mask.png         # image not yet added — drop the reference image here for AI assertions
    name: "Mask"
    math_name: "P3"
    type: high
    description: "STT 05. Type 'Normal (Include wild)'. No payout values documented."

  p4:
    file: symbols/P4_Cog.png          # image not yet added — drop the reference image here for AI assertions
    name: "Cog"
    math_name: "P4"
    type: high
    description: "STT 06. Type 'Normal (Include wild)'. No payout values documented."

  sym_a:
    file: symbols/A.png               # image not yet added — drop the reference image here for AI assertions
