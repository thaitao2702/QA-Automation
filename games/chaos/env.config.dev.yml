# env.config.dev.yml — Zeus, dev environment.
# Self-contained: only the dev environment's config. Loaded by the runner when
# invoked with --env dev (resolved via framework/env_files.py game_config_path).
#
# dev — remote development server with bridge and debug logging enabled.

# URL resolution, in the order the runner tries them (scripts/run_scenario.py resolve_url):
#   base_url  -> mint a fresh token via url_script and graft ITS QUERY onto base_url. This is the
#                one to use here: the bridge-enabled build is served LOCALLY, while the token the
#                backend mints points at https://dev-play.royaledge.io, whose build has NO
#                __gameTestBridge. Grafting gives both halves — a live session AND the bridge.
#   url       -> a pasted launch URL, used as-is. Handy for a one-off manual run, but its token
#                EXPIRES, and it is skipped entirely for a language run because the language is
#                baked into the token.
#   url_script-> resolve wholly from the backend (the remote build; no bridge).
#
# ⚠ WAS BROKEN, fixed 2026-09-06. `url:` held a pasted token that had expired: the server answered
# every load with {"code":-4,"msg":"Session is not exists or expired"}, the game showed
# "Oops! Invalid request [-4]" instead of the Start button, and `startGame()` never resolved — every
# run stalled before Start with no useful error. `language-tour` looked like the culprit only
# because it is the one scenario that re-mints tokens, and its fresh token loaded the REMOTE build,
# which has no bridge. base_url fixes both: verified in en and th, bridge present, startGame()
# resolved in 2.8s / 0.1s, sceneReady true, canDo('spin') ok.
base_url: "http://192.168.1.27:7456/web-mobile/sl_35_chaos_runner/index.html"
url: ""              # leave empty: a pasted token expires and is ignored for language runs anyway
url_script: "python scripts/get_game_url_playsite.py --env=dev"
browser_params: "?bridge=1&debug=1"

# Playsite launch (game-specific). Used by url_script when resolving the URL:
# the runner injects these as PLAYSITE_GAME_CODE / PLAYSITE_CURRENCY. The
# Playsite API base + player credentials are NOT here — they are shared infra
# and live in the root .env overlay (PLAYSITE_API_URL / PLAYSITE_USER / PLAYSITE_PASS).
playsite:
  game_code: sl_35_chaos_runner
  currency: TKN        # omit to use the player's default wallet

# Back-office identifiers for paytable control (bo_paytable_* steps).
bo:
  game_id: 271
  sas_entity_id: 1
  agent_id: 1
  currency_id: 31
  # BO spells this UPPERCASE and the agent-game lookup is case-sensitive; the lowercase
  # form above under playsite: is the LAUNCH code and is a different thing. Verified
  # against BO 2026-09-03: the agent's game row is (41469, 'SL_35_CHAOS_RUNNER').
  game_code: SL_35_CHAOS_RUNNER
  # This game's automation paytable is spelled `Automation_test` (Zeus uses `AutomationTest`).
  # Verified against BO 2026-09-03 — game 271 carries: RTP, RTP_testPayline, GC_FS,
  # RTP_bigwin, Automation_test. Writing to the wrong code leaves the game on its real
  # weights while the run still reports the paytable was set.
  paytable_code: Automation_test
  # FALLBACK ONLY. A suite's `max_win_x` is resolved against the bet read off the OPEN
  # game -- the runner opens it, reads the stake, then pushes the cap and re-enters. This
  # value is used only when that read is impossible (the game will not open, or the build
  # publishes no bet). It was the sole source until 2026-09-04, and being stale is exactly
  # why the caps were wrong: 0.6 against a game that opens at 4.00 turned `max_win_x: 500`
  # into a 300 cap. Kept at the historical value so the fallback path stays unchanged;
  # correct it if you ever see the runner report `bet[live] unreadable`.
  reference_bet: 0.6

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
