# env.config.dev.yml — Joker: Where's My Banana, dev environment.
# Self-contained: only the dev environment's config. Loaded by the runner when
# invoked with --env dev (resolved via framework/env_files.py game_config_path).
#
# ⚠ THE VALUES BELOW HAVE NOT BEEN VERIFIED AGAINST A RUNNING BUILD OR AGAINST BO. They were
# filled in by hand into a copy of Dragon VIP's file; the prose has been corrected to describe
# THIS game, but every id is still exactly as it was entered. Confirm each one before trusting a
# result — a wrong `bo.game_id` or `bo.game_code` does not fail loudly: the run reports the
# paytable was set while the game keeps playing its REAL weights, and a forced case then passes
# or fails for reasons that have nothing to do with the claim.
#
# ⚠ `bo.paytable_code` IS NOT SET, so the runner falls back to the historical default
# `AutomationTest` (scripts/run_scenario.py, bo_setup). That is ZEUS's spelling; Chaos carries
# `Automation_test` on the same BO and would silently no-op on the other one. **Read this game's
# real paytable list off BO and pin it here** — this is the single most dangerous blank in the
# file, because writing to a code the game does not carry is the failure that still reports
# success (games/joker/paytables/README.md says the same).
#
# ⚠ `currency_id: 18` is the pair Zeus and Dragon already run on. A denomination belongs to a
# (sub-category, currency) pair, so if Joker shares that pair, JK-57/JK-58's automation ladder is
# SHARED with them: safe back to back, not side by side (docs/bo-denominations.md). If Joker has
# its own 5x3 sub-category the ladder is its own and the first run creates it.

# URL resolution: a non-empty 'url' is used directly (paste a fresh launch URL
# here for a quick manual run). Clear it (url: "") to fall back to 'url_script',
# which resolves the URL dynamically via the Playsite login flow.
base_url: "http://192.168.1.27:7458/web-mobile/sl_35_wheres_banana/index.html"   # ⚠ unverified
url: ""
url_script: "python scripts/get_game_url_playsite.py --env=dev"
browser_params: "?bridge=1&debug=1"

# Playsite launch (game-specific). Used by url_script when resolving the URL:
# the runner injects these as PLAYSITE_GAME_CODE / PLAYSITE_CURRENCY. The
# Playsite API base + player credentials are NOT here — they are shared infra
# and live in the root .env overlay (PLAYSITE_API_URL / PLAYSITE_USER / PLAYSITE_PASS).
playsite:
  game_code: sl_35_wheres_banana        # ⚠ unverified — the lowercase LAUNCH code
  currency: TRY         # omit to use the player's default wallet

# Back-office identifiers for paytable control.
# The forced runs in jk-features.yml, jk-core.yml (JK-35/36) and jk-lastbet.yml push
# games/joker/paytables/joker-fs-easy.json, which is THIS game's reel weights. Pushed to another
# game's BO record it would configure symbols that game does not have.
# `game_code` is UPPERCASE here and the agent-game lookup is CASE-SENSITIVE — it is a different
# thing from the lowercase launch code under playsite: above.
bo:
  sas_entity_id: 1
  game_id: 58       # ⚠ unverified
  agent_id: 1
  currency_id: 18
  game_code: SL_35_WHERES_BANANA         # ⚠ unverified — UPPERCASE, case-sensitive
  # paytable_code: …                     # ⚠ NOT SET — see the header. Falls back to `AutomationTest`.

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
