# env.config.prod.yml — Zeus, production environment.
# Self-contained: only the prod environment's config. Loaded by the runner
# when invoked with --env prod.
#
# prod — production; no bridge. Smoke/visual tests only.

url_script: "python scripts/get_game_url_playsite.py --env=prod"
browser_params: ""

# Playsite launch (game-specific). Injected by the runner as PLAYSITE_GAME_CODE /
# PLAYSITE_CURRENCY. API base + credentials live in the root .env.prod overlay.
playsite:
  game_code: sl_33_zappin_zeus
  currency: TRY        # omit to use the player's default wallet

# No bo: block — paytable control is not used against production.

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
