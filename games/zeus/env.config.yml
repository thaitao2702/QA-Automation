# env.config.yml — Zeus slot game environment configuration.
# Resolved by scripts/get_url.py before Playwright launches the browser.

environments:

  # ---------------------------------------------------------------------------
  # dev — local or development server with bridge and debug logging enabled
  # ---------------------------------------------------------------------------
  dev:
    url: "http://192.168.1.65:7456/web-mobile/sl_33_zappin_zeus/index.html?"
    url_script: "python scripts/get_url.py --env=dev"
    browser_params: "?bridge=1&debug=1"

  # ---------------------------------------------------------------------------
  # staging — pre-production environment; bridge enabled, no debug noise
  # ---------------------------------------------------------------------------
  staging:
    url_script: "python scripts/get_url.py --env=staging"
    browser_params: "?bridge=1"

  # ---------------------------------------------------------------------------
  # prod — production; no bridge. Smoke/visual tests only.
  # ---------------------------------------------------------------------------
  prod:
    url_script: "python scripts/get_url.py --env=prod"
    browser_params: ""

# ---------------------------------------------------------------------------
# detection — symbol detection configuration (shared across all environments)
# ---------------------------------------------------------------------------
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
