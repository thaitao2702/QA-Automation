# env.config.stg.yml — Zeus, staging environment.
# Self-contained: only the staging environment's config. Loaded by the runner
# when invoked with --env staging.
#
# staging — pre-production environment; bridge enabled, no debug noise.

url_script: "python scripts/get_game_url_playsite.py --env=staging"
browser_params: "?bridge=1"

# Playsite launch (game-specific). Injected by the runner as PLAYSITE_GAME_CODE /
# PLAYSITE_CURRENCY. API base + credentials live in the root .env.stg overlay.
playsite:
  game_code: sl_33_zappin_zeus
  currency: TRY        # omit to use the player's default wallet

# Back-office identifiers for paytable control (bo_paytable_* steps).
# TODO: confirm the staging game/agent/currency for the automation account.
bo:
  game_id: 63
  sas_entity_id: 1
  agent_id: 1
  currency_id: 18
  game_code: SL_33_ZAPPIN_ZEUS

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
