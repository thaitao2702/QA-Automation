# env.config.local.yml — Zeus, local environment.
# Self-contained: only the local environment's config. Loaded by the runner
# when invoked with --env local.
#
# local — local dev server; token/session from dev API, served from local IP.

url_script: "python scripts/get_game_url_playsite.py --env=dev --base-url=http://192.168.1.65:7456"
browser_params: "?bridge=1&debug=1"

# Playsite launch (game-specific). Injected by the runner as PLAYSITE_GAME_CODE /
# PLAYSITE_CURRENCY. API base + credentials live in the root .env.local overlay
# (local resolves the launch token from the dev backend; see --env=dev above).
playsite:
  game_code: sl_33_zappin_zeus
  currency: TRY        # omit to use the player's default wallet

# Back-office identifiers for paytable control (bo_paytable_* steps).
# Local plays against the dev API, so dev BO identifiers apply.
bo:
  game_id: 63
  sas_entity_id: 1
  agent_id: 1
  currency_id: 18
  game_code: SL_33_ZAPPIN_ZEUS

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
