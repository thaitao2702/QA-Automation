suite: "Core UI & Basic Spin"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 60000
  suite_timeout_ms: 600000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - action: navigate
    params: { url_script: "get_game_url" }
  - action: wait_for_state
    params: { state: "ready", timeout_ms: 15000 }
  - action: click
    params: { selector: "#start-button" }
  - action: wait_for_state
    params: { state: "idle", timeout_ms: 15000 }

teardown: []

tests:

  # ---------------------------------------------------------------------------
  # ZZ-01 — Game loads to idle state
  # ---------------------------------------------------------------------------
  - id: ZZ-01
    title: "Game loads to idle state"
    description: "Verify the game completes initial load (INITIAL→CONNECTING→LOADING→READY→IDLE) and reaches idle state within timeout."
    setup: []
    steps:
      - id: step-01
        description: "Assert app state is idle after load"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
          ai:
            mode: image
            ref_screenshot: step-01
            ref_assets: [spin_button, balance_label, bet_label]
            prompt: "Is the slot game fully loaded and showing the main game screen with spin button, balance display, and bet display visible? Return JSON."
            output_schema:
              game_loaded: { type: boolean }
              spin_button_visible: { type: boolean }
              balance_visible: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { game_loaded: true, spin_button_visible: true, balance_visible: true, confidence: high }
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-02 — Spin button is interactable at idle
  # ---------------------------------------------------------------------------
  - id: ZZ-02
    title: "Spin button interactable at idle"
    description: "Verify the spin button is enabled when the game is at idle state with sufficient balance."
    setup: []
    steps:
      - id: step-01
        description: "Assert spin button is enabled"
        assert:
          bridge:
            method: isSpinEnabled
            expected: true
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-03 — Bet label displays current bet amount
  # ---------------------------------------------------------------------------
  - id: ZZ-03
    title: "Bet label shows current bet amount"
    description: "Verify the displayed bet label matches the bridge bet amount at the default denomination."
    setup: []
    steps:
      - id: step-01
        description: "Capture bet label"
        action: capture
        capture: true

      - id: step-02
        description: "Assert displayed bet matches bridge getBetAmount"
        assert:
          bridge:
            method: getBetAmount
            expected_type: number
          ai:
            mode: image
            ref_screenshot: step-01
            ref_assets: [bet_label]
            prompt: "What is the numeric value shown in the bet amount area at the bottom of the screen? Return JSON with the numeric value as a string."
            output_schema:
              bet_value: { type: string }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { confidence: high }
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-04 — Balance label displays current balance
  # ---------------------------------------------------------------------------
  - id: ZZ-04
    title: "Balance label shows current balance"
    description: "Verify the displayed balance label matches the bridge getBalance value."
    setup: []
    steps:
      - id: step-01
        description: "Capture balance area"
        action: capture
        capture: true

      - id: step-02
        description: "Assert displayed balance matches bridge getBalance"
        assert:
          bridge:
            method: getBalance
            expected_type: number
          ai:
            mode: image
            ref_screenshot: step-01
            ref_assets: [balance_label]
            prompt: "What is the numeric value shown in the balance area of the slot game? Return JSON with the numeric value as a string."
            output_schema:
              balance_value: { type: string }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { confidence: high }
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-09 — Paytable popup opens and closes
  # ---------------------------------------------------------------------------
  - id: ZZ-09
    title: "Paytable popup opens and closes"
    description: "Verify the info button opens the paytable popup and it can be dismissed, returning to idle."
    setup: []
    steps:
      - id: step-01
        description: "Open info/paytable popup"
        action: bridge_action
        params: { name: "openInfo" }

      - id: step-02
        description: "Capture paytable popup"
        action: capture
        capture: true

      - id: step-03
        description: "Assert paytable popup is visible"
        assert:
          ai:
            mode: image
            ref_screenshot: step-02
            ref_assets: [paytable_popup]
            prompt: "Is a paytable or info popup currently displayed on screen showing symbol pay rates or game information? Return JSON."
            output_schema:
              popup_visible: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { popup_visible: true, confidence: high }

      - id: step-04
        description: "Close popup by pressing Escape"
        action: press_key
        params: { key: "Escape" }

      - id: step-05
        description: "Assert game returns to idle after closing paytable"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 5000 }

      - id: step-06
        description: "Assert app state is idle"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-11 — Bet selection via nextBet increases bet
  # ---------------------------------------------------------------------------
  - id: ZZ-11
    title: "Next bet button increases bet amount"
    description: "Verify pressing the next bet button advances the denomination index and updates the displayed bet."
    setup: []
    steps:
      - id: step-01
        description: "Record current bet index before change"
        action: bridge_action
        params: { name: "getBetIndex" }

      - id: step-02
        description: "Click next bet button"
        action: bridge_action
        params: { name: "nextBet" }

      - id: step-03
        description: "Assert bet index has incremented by 1"
        assert:
          bridge:
            method: getBetIndex
            expected_relative: { operator: ">", reference_step: "step-01" }
    teardown:
      # Reset to default bet index (0) to avoid affecting subsequent tests
      - action: bridge_action
        params: { name: "selectBet", index: 0 }

  # ---------------------------------------------------------------------------
  # ZZ-12 — Bet selection via selectBet sets a specific denomination
  # ---------------------------------------------------------------------------
  - id: ZZ-12
    title: "selectBet sets the exact denomination index"
    description: "Verify that calling selectBet with index 2 sets betIndex to 2 and updates the displayed bet label."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Select denomination at index 2"
        action: bridge_action
        params: { name: "selectBet", index: 2 }

      - id: step-02
        description: "Capture bet label after selection"
        action: capture
        capture: true

      - id: step-03
        description: "Assert betIndex is 2"
        assert:
          bridge:
            method: getBetIndex
            expected: 2
          ai:
            mode: image
            ref_screenshot: step-02
            ref_assets: [bet_label]
            prompt: "Is a bet amount displayed on screen? What is the numeric value shown? Return JSON."
            output_schema:
              bet_displayed: { type: boolean }
              bet_value: { type: string }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { bet_displayed: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }

  # ---------------------------------------------------------------------------
  # ZZ-44 — Initial app state is idle after boot
  # ---------------------------------------------------------------------------
  - id: ZZ-44
    title: "Initial app state is idle after boot"
    description: "Confirm getAppState returns 'idle' after the game successfully completes its loading sequence."
    setup: []
    steps:
      - id: step-01
        description: "Assert app state is idle"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-45 — Spin transitions through betting→result→idle
  # ---------------------------------------------------------------------------
  - id: ZZ-45
    title: "Basic spin completes: idle → betting → result → idle"
    description: "Verify a single spin cycles through the expected AppState sequence and returns to idle."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Trigger spin"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for spin to complete and return to idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 15000 }

      - id: step-03
        description: "Assert game is back at idle after spin"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
          ai:
            mode: video
            video_trim:
              from_step: step-01
              to_step: step-02
            ref_assets: [spin_button, wild, zeus, coin]
            prompt: |
              Watch this slot machine spin sequence.
              1. Did the reels start spinning after the spin was triggered?
              2. Did the reels stop and show a final result?
              3. Is the game back to a ready/idle state at the end of the clip?
              Return JSON.
            output_schema:
              reels_spun: { type: boolean }
              reels_stopped: { type: boolean }
              game_idle_at_end: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { reels_spun: true, reels_stopped: true, game_idle_at_end: true, confidence: high }
    teardown: []
