suite: "Auto Spin Mechanics"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 90000
  suite_timeout_ms: 900000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - action: navigate
    params: { url_script: "get_game_url" }
  - action: wait_for_state
    params: { state: "ready", timeout_ms: 15000 }
  - action: click
    params: { selector: "#start-button" }
  - action: wait_for_state
    params: { state: "idle", timeout_ms: 15000 }

teardown: []

tests:

  # ---------------------------------------------------------------------------
  # ZZ-13 — Auto-spin popup opens
  # ---------------------------------------------------------------------------
  - id: ZZ-13
    title: "Auto-spin popup opens on auto button click"
    description: "Verify clicking the auto button opens the auto-spin configuration popup."
    setup: []
    steps:
      - id: step-01
        description: "Open auto-spin popup"
        action: bridge_action
        params: { name: "openAutoPopup" }

      - id: step-02
        description: "Capture popup state"
        action: capture
        capture: true

      - id: step-03
        description: "Assert auto popup is visible with package options"
        assert:
          ai:
            mode: image
            ref_screenshot: step-02
            ref_assets: [auto_button]
            prompt: "Is an auto-spin configuration popup visible on screen showing spin count options (e.g. 10, 20, 30, 50, or unlimited)? Return JSON."
            output_schema:
              popup_visible: { type: boolean }
              has_count_options: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { popup_visible: true, has_count_options: true, confidence: high }
    teardown:
      - action: press_key
        params: { key: "Escape" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 5000 }

  # ---------------------------------------------------------------------------
  # ZZ-14 — Auto-spin starts with count 10
  # ---------------------------------------------------------------------------
  - id: ZZ-14
    title: "Auto-spin starts with package=10 and counts down"
    description: "Verify startAutoSpin(10, false) begins auto-spin and getAutoSpinsRemaining decreases after each spin."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Start auto-spin with 10 spins, no stop-by-win"
        action: bridge_action
        params: { name: "startAutoSpin", count: 10, stopByWin: false }

      - id: step-02
        description: "Wait for first spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Assert auto spins remaining is less than 10 (at least 1 spin completed)"
        assert:
          bridge:
            method: getAutoSpinsRemaining
            expected_relative: { operator: "<", value: 10 }

      - id: step-04
        description: "Assert stop-auto button is visible (auto session active)"
        assert:
          bridge:
            method: isStopAutoVisible
            expected: true
    teardown:
      - action: bridge_action
        params: { name: "stopAutoSpin" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }

  # ---------------------------------------------------------------------------
  # ZZ-15 — Auto-spin package 20 starts correctly
  # ---------------------------------------------------------------------------
  - id: ZZ-15
    title: "Auto-spin starts with package=20"
    description: "Verify startAutoSpin(20, false) sets the auto count to 20 and initiates spinning."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Start auto-spin with 20 spins"
        action: bridge_action
        params: { name: "startAutoSpin", count: 20, stopByWin: false }

      - id: step-02
        description: "Wait for first spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Assert auto spins remaining is less than 20"
        assert:
          bridge:
            method: getAutoSpinsRemaining
            expected_relative: { operator: "<", value: 20 }
    teardown:
      - action: bridge_action
        params: { name: "stopAutoSpin" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }

  # ---------------------------------------------------------------------------
  # ZZ-17 — Auto-spin package 30 starts correctly
  # ---------------------------------------------------------------------------
  - id: ZZ-17
    title: "Auto-spin starts with package=30"
    description: "Verify startAutoSpin(30, false) initiates auto-spin with 30 spins remaining."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Start auto-spin with 30 spins"
        action: bridge_action
        params: { name: "startAutoSpin", count: 30, stopByWin: false }

      - id: step-02
        description: "Wait for first spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Assert auto spins remaining is less than 30"
        assert:
          bridge:
            method: getAutoSpinsRemaining
            expected_relative: { operator: "<", value: 30 }
    teardown:
      - action: bridge_action
        params: { name: "stopAutoSpin" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }

  # ---------------------------------------------------------------------------
  # ZZ-18 — Auto-spin package 50 starts correctly
  # ---------------------------------------------------------------------------
  - id: ZZ-18
    title: "Auto-spin starts with package=50"
    description: "Verify startAutoSpin(50, false) initiates auto-spin with 50 spins remaining."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Start auto-spin with 50 spins"
        action: bridge_action
        params: { name: "startAutoSpin", count: 50, stopByWin: false }

      - id: step-02
        description: "Wait for first spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Assert auto spins remaining is less than 50"
        assert:
          bridge:
            method: getAutoSpinsRemaining
            expected_relative: { operator: "<", value: 50 }
    teardown:
      - action: bridge_action
        params: { name: "stopAutoSpin" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }

  # ---------------------------------------------------------------------------
  # ZZ-19 — Stop-by-win halts auto-spin on winning spin
  # ---------------------------------------------------------------------------
  - id: ZZ-19
    title: "Stop-by-win option halts auto-spin after a winning spin"
    description: "Verify that when stopByWin=true and a spin produces payout>0, auto-spin stops and the session ends."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Inject a guaranteed small win (3x King across middle row, payout > 0)
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[1, 3, 1], [4, 4, 4], [3, 1, 3]]
    steps:
      - id: step-01
        description: "Start auto-spin with 10 spins and stop-by-win enabled"
        action: bridge_action
        params: { name: "startAutoSpin", count: 10, stopByWin: true }

      - id: step-02
        description: "Wait for spin to complete (injected win will trigger stop)"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Assert auto-spin has stopped (stop-auto button no longer visible)"
        assert:
          bridge:
            method: isStopAutoVisible
            expected: false

      - id: step-04
        description: "Assert last spin produced a payout (confirming stop was triggered by win)"
        assert:
          bridge:
            method: getLastPayout
            expected_relative: { operator: ">", value: 0 }
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }

  # ---------------------------------------------------------------------------
  # ZZ-20 — Manual stop cancels active auto-spin
  # ---------------------------------------------------------------------------
  - id: ZZ-20
    title: "Manual stopAutoSpin cancels active auto-spin session"
    description: "Verify that calling stopAutoSpin while auto-spin is running terminates the session and hides the stop-auto button."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Start auto-spin with 50 spins (enough to still be running when we stop)"
        action: bridge_action
        params: { name: "startAutoSpin", count: 50, stopByWin: false }

      - id: step-02
        description: "Wait for at least one spin to start"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 20000 }

      - id: step-03
        description: "Stop auto-spin manually"
        action: bridge_action
        params: { name: "stopAutoSpin" }

      - id: step-04
        description: "Wait for game to settle at idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }

      - id: step-05
        description: "Assert auto session is no longer active"
        assert:
          bridge:
            method: isStopAutoVisible
            expected: false
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-21 — Auto button enabled at idle, stop-auto button hidden at idle
  # ---------------------------------------------------------------------------
  - id: ZZ-21
    title: "Auto button state: enabled at idle, stop-auto hidden at idle"
    description: "Verify that at idle (no auto session), autoButton is interactable and stopAutoButton is not visible."
    setup: []
    steps:
      - id: step-01
        description: "Assert auto button is enabled at idle"
        assert:
          bridge:
            method: isAutoEnabled
            expected: true

      - id: step-02
        description: "Assert stop-auto button is not visible at idle"
        assert:
          bridge:
            method: isStopAutoVisible
            expected: false
    teardown: []
