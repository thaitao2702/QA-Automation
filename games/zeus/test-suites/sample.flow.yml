suite: "Authoring sample (golden fixture)"
game: zeus
version: "1.0"
config:
  detection_method: both
  video: true
  test_timeout_ms: 120000
  suite_timeout_ms: 1200000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - start the game

tests:

  - id: ZZ-03
    title: "Increase/Decrease Bet"
    description: "Verify bet increases on nextBet and decreases on previousBet"
    steps:
      - expect bet index is 0
      - take a screenshot as before_inc
      - increase bet
      - expect bet index is 1
      - take a screenshot as after_inc
      - check that the bet increased between before_inc and after_inc
      - decrease bet
      - expect bet index is 0

  - id: ZZ-05
    title: "Balance Deduction on Bet"
    description: "Verify balance decreases after a no-win spin"
    setup:
      - force grid "no-win"
    steps:
      - remember balance as before
      - take a screenshot as before_shot
      - spin and wait for result
      - expect last payout is 0
      - take a screenshot as after_shot
      - check that the balance decreased between before_shot and after_shot
    teardown:
      - reset forced grid

groups:
  - id: fs-trigger3-countdown
    title: "3-coin trigger, respins count down"
    asset_groups: [symbols, ui_elements]
    setup:
      - force grid "3 coins top row"
    runs:
      - id: fs-3coin-run
        title: "One bonus play, several case verdicts"
        cases:
          - { id: ZZ-30, title: "Trigger free spin (3-8 coins)" }
          - { id: ZZ-32, title: "Coins stay locked" }
          - { id: ZZ-35, title: "Returns to base game" }
        steps:
          - remember balance as before
          - spin through the whole bonus as bonus_spin
          - expect game state is idle @case ZZ-30
          - expect free spins remaining is 0 @case ZZ-30
          - take a screenshot as endshot
          - check that endshot shows the bonus has ended @case ZZ-35
          - raw:
              action: assert
              assert:
                ai:
                  mode: video
                  video_trim: { from_step: "@bonus_spin", to_step: "@endshot" }
                  ref_assets: [coin, hold_spin_overlay]
                  prompt: "Did the coins stay locked through the Hold & Spin re-spins?"
                  output_schema:
                    coins_stay_locked: { type: boolean }
                    confidence: { type: string, enum: [high, medium, low] }
                  expected_by_case:
                    ZZ-32: { coins_stay_locked: true, confidence: high }
    teardown:
      - reset forced grid
