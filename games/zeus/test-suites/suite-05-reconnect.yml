suite: "Reconnect & Network Recovery"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 90000
  suite_timeout_ms: 600000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - action: navigate
    params: { url_script: "get_game_url" }
  - action: wait_for_state
    params: { state: "ready", timeout_ms: 15000 }
  - action: click
    params: { selector: "#start-button" }
  - action: wait_for_state
    params: { state: "idle", timeout_ms: 15000 }

teardown: []

tests:

  # ---------------------------------------------------------------------------
  # ZZ-26 — Game enters error/reconnecting state on network loss
  # ---------------------------------------------------------------------------
  - id: ZZ-26
    title: "Network loss causes game to enter reconnecting state"
    description: "Verify that going offline triggers an AppState transition away from idle (to 'error' or 'reconnecting'), indicating the game detects the connection loss."
    setup:
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }
    steps:
      - id: step-01
        description: "Take network offline"
        action: go_offline

      - id: step-02
        description: "Wait for the game to detect the lost connection (error or reconnecting state)"
        action: wait_for_state
        params: { state: "reconnecting", timeout_ms: 30000 }

      - id: step-03
        description: "Assert app is not in idle state (connection loss detected)"
        assert:
          bridge:
            method: getAppState
            expected_not: "idle"
    teardown:
      - action: go_online
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

  # ---------------------------------------------------------------------------
  # ZZ-27 — Game recovers to idle after network is restored
  # ---------------------------------------------------------------------------
  - id: ZZ-27
    title: "Game recovers to idle after network is restored"
    description: "Verify that bringing the network back online after a disconnect allows the game to reconnect and return to idle state."
    setup:
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }
    steps:
      - id: step-01
        description: "Take network offline"
        action: go_offline

      - id: step-02
        description: "Wait briefly to ensure disconnect is detected"
        action: wait_ms
        params: { ms: 3000 }

      - id: step-03
        description: "Restore network"
        action: go_online

      - id: step-04
        description: "Wait for game to reconnect and return to idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 45000 }

      - id: step-05
        description: "Assert game is back at idle with spin button enabled"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
          ai:
            mode: image
            ref_screenshot: step-04
            ref_assets: [spin_button, balance_label]
            prompt: "Is the slot game showing the main game screen in a ready/idle state with the spin button visible and enabled? Return JSON."
            output_schema:
              game_ready: { type: boolean }
              spin_button_visible: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { game_ready: true, spin_button_visible: true, confidence: high }
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-28 — Balance is preserved after reconnect
  # ---------------------------------------------------------------------------
  - id: ZZ-28
    title: "Player balance is preserved after network reconnect"
    description: "Verify the balance after reconnecting matches the balance before the network was lost. The server is the authoritative balance source."
    setup:
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }
    steps:
      - id: step-01
        description: "Record balance before disconnect"
        action: bridge_action
        params: { name: "getBalance" }

      - id: step-02
        description: "Take network offline"
        action: go_offline

      - id: step-03
        description: "Wait for disconnect to register"
        action: wait_ms
        params: { ms: 3000 }

      - id: step-04
        description: "Restore network"
        action: go_online

      - id: step-05
        description: "Wait for game to return to idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 45000 }

      - id: step-06
        description: "Assert balance after reconnect matches balance before disconnect"
        assert:
          bridge:
            method: getBalance
            expected_relative:
              operator: "="
              reference_step: "step-01"
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-29 — Game state is consistent after reconnect (no pending spin left over)
  # ---------------------------------------------------------------------------
  - id: ZZ-29
    title: "Game state consistent after reconnect — no pending spin left over"
    description: "Verify that after reconnecting at idle (no spin in flight), the game resumes at a clean idle state: spin enabled, auto disabled, no bonus state active."
    setup:
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 10000 }
    steps:
      - id: step-01
        description: "Take network offline and restore"
        action: go_offline

      - id: step-02
        description: "Wait briefly"
        action: wait_ms
        params: { ms: 3000 }

      - id: step-03
        description: "Restore network"
        action: go_online

      - id: step-04
        description: "Wait for game to return to idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 45000 }

      - id: step-05
        description: "Assert app state is idle"
        assert:
          bridge:
            method: getAppState
            expected: "idle"

      - id: step-06
        description: "Assert spin button is enabled (no stuck state)"
        assert:
          bridge:
            method: isSpinEnabled
            expected: true

      - id: step-07
        description: "Assert spin state is NORMAL (not stuck in bonus)"
        assert:
          bridge:
            method: getSpinState
            expected: "NORMAL"

      - id: step-08
        description: "Assert stop-auto button is not visible (no ghost auto-spin session)"
        assert:
          bridge:
            method: isStopAutoVisible
            expected: false
    teardown: []
