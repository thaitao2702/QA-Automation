suite: "Hold & Spin Free Spin Mechanics"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 120000
  suite_timeout_ms: 1200000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - action: navigate
    params: { url_script: "get_game_url" }
  - action: wait_for_state
    params: { state: "ready", timeout_ms: 15000 }
  - action: click
    params: { selector: "#start-button" }
  - action: wait_for_state
    params: { state: "idle", timeout_ms: 15000 }

teardown: []

tests:

  # ---------------------------------------------------------------------------
  # ZZ-30 — Hold & Spin triggered by 3 coins (minimum trigger)
  # ---------------------------------------------------------------------------
  - id: ZZ-30
    title: "Hold & Spin triggered by 3 COIN symbols"
    description: "Verify that landing exactly 3 COIN symbols starts the Hold and Spin bonus: SpinState=START_BONUS, 3 free spins granted, coins visible and locked."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # 3 coins in bottom row, remaining cells are non-coin, non-winning
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[1, 3, 4], [3, 4, 1], [13, 13, 13]]
    steps:
      - id: step-01
        description: "Trigger spin with 3 COIN result"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus to start and stabilise at idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Capture bonus screen"
        action: capture
        capture: true

      - id: step-04
        description: "Assert spin state is START_BONUS or IN_BONUS (bonus is active)"
        assert:
          bridge:
            method: getSpinState
            expected_one_of: ["START_BONUS", "IN_BONUS"]

      - id: step-05
        description: "Assert free spins remaining is 3"
        assert:
          bridge:
            method: getFreeSpinsRemaining
            expected: 3
          ai:
            mode: image
            ref_screenshot: step-03
            ref_assets: [coin, free_spin_counter, hold_spin_overlay]
            prompt: "Is the Hold and Spin bonus active? How many re-spins remaining are shown on the counter? Are coins visible on the grid? Return JSON."
            output_schema:
              bonus_active: { type: boolean }
              respins_shown: { type: number }
              coins_on_grid: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { bonus_active: true, respins_shown: 3, coins_on_grid: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-31 — Hold & Spin triggered by 9 coins (full grid fill)
  # ---------------------------------------------------------------------------
  - id: ZZ-31
    title: "Hold & Spin with 9 COIN symbols fills grid immediately"
    description: "Verify that landing 9 COIN symbols (full grid) starts and immediately ends the bonus with all cells locked."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # All 9 cells are COIN (ID=13)
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [13, 13, 13], [13, 13, 13]]
    steps:
      - id: step-01
        description: "Trigger spin with full-grid COIN result"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus to complete (grid full ends bonus immediately)"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

      - id: step-03
        description: "Capture end state"
        action: capture
        capture: true

      - id: step-04
        description: "Assert game is back at idle (bonus ended)"
        assert:
          bridge:
            method: getAppState
            expected: "idle"

      - id: step-05
        description: "Assert spin state returned to NORMAL after bonus"
        assert:
          bridge:
            method: getSpinState
            expected: "NORMAL"
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }

  # ---------------------------------------------------------------------------
  # ZZ-32 — Coins stay locked on re-spin (coin locking mechanic)
  # ---------------------------------------------------------------------------
  - id: ZZ-32
    title: "Coins remain locked on re-spin positions"
    description: "Verify that coins from the trigger spin are locked in their positions and not replaced by a subsequent re-spin result."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Trigger bonus with 3 coins at known positions (row 0: cols 0,1,2)
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Trigger spin to enter bonus"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus to become active"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Record coin positions after trigger spin"
        action: bridge_action
        params: { name: "getCoinPositions" }

      - id: step-04
        description: "Capture grid showing locked coins"
        action: capture
        capture: true

      - id: step-05
        description: "Assert 3 coins are locked in the grid"
        assert:
          bridge:
            method: getCoinPositions
            expected_count: 3
          ai:
            mode: image
            ref_screenshot: step-04
            ref_assets: [coin, hold_spin_overlay]
            prompt: "Are there locked coin symbols visible on the Hold and Spin grid? Do they appear fixed/locked (not spinning)? Return JSON."
            output_schema:
              locked_coins_visible: { type: boolean }
              coins_appear_locked: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { locked_coins_visible: true, coins_appear_locked: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-33 — Re-spin counter resets to 3 when a new coin lands
  # ---------------------------------------------------------------------------
  - id: ZZ-33
    title: "Re-spin counter resets to 3 when a new coin lands"
    description: "Verify that a re-spin result containing a new coin resets the free spins counter back to 3 (not decrement to 2)."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Trigger with 3 coins to enter bonus
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Enter bonus with 3 coins"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus state"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Assert free spins = 3 after trigger"
        assert:
          bridge:
            method: getFreeSpinsRemaining
            expected: 3

      - id: step-04
        description: "Inject next re-spin result: one new coin (row 1, col 0)"
        action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [13, 3, 4], [3, 4, 1]]

      - id: step-05
        description: "Trigger re-spin"
        action: bridge_action
        params: { name: "spin" }

      - id: step-06
        description: "Wait for re-spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-07
        description: "Assert free spins counter reset to 3 (new coin landed)"
        assert:
          bridge:
            method: getFreeSpinsRemaining
            expected: 3
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-34 — Re-spin counter decrements when no new coin lands
  # ---------------------------------------------------------------------------
  - id: ZZ-34
    title: "Re-spin counter decrements by 1 when no new coin lands"
    description: "Verify that a re-spin with no new coin decrements the free spins counter from 3 to 2."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Trigger with 3 coins
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Enter bonus with 3 coins"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus state"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Assert free spins = 3 after trigger"
        assert:
          bridge:
            method: getFreeSpinsRemaining
            expected: 3

      - id: step-04
        description: "Inject re-spin with no new coins"
        action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]

      - id: step-05
        description: "Trigger re-spin (no new coin)"
        action: bridge_action
        params: { name: "spin" }

      - id: step-06
        description: "Wait for re-spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-07
        description: "Assert free spins decremented to 2"
        assert:
          bridge:
            method: getFreeSpinsRemaining
            expected: 2
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-35 — Bonus ends when counter reaches 0
  # ---------------------------------------------------------------------------
  - id: ZZ-35
    title: "Hold & Spin bonus ends when re-spin counter reaches 0"
    description: "Verify that three consecutive re-spins with no new coins end the bonus and return the game to NORMAL spin state."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Trigger with 3 coins
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Enter bonus with 3 coins"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus state"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Inject losing re-spin (no new coin)"
        action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]

      - id: step-04
        description: "Re-spin 1 of 3 (no new coin)"
        action: bridge_action
        params: { name: "spin" }

      - id: step-05
        description: "Wait for re-spin 1"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-06
        description: "Re-spin 2 of 3 (no new coin)"
        action: bridge_action
        params: { name: "spin" }

      - id: step-07
        description: "Wait for re-spin 2"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-08
        description: "Re-spin 3 of 3 (no new coin — this should end the bonus)"
        action: bridge_action
        params: { name: "spin" }

      - id: step-09
        description: "Wait for bonus to resolve and return to idle"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

      - id: step-10
        description: "Assert bonus ended and spin state is NORMAL"
        assert:
          bridge:
            method: getSpinState
            expected: "NORMAL"

      - id: step-11
        description: "Assert spin button is enabled (normal play resumes)"
        assert:
          bridge:
            method: isSpinEnabled
            expected: true
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }

  # ---------------------------------------------------------------------------
  # ZZ-36 — Minor jackpot coin awards jackpot value
  # ---------------------------------------------------------------------------
  - id: ZZ-36
    title: "MINOR jackpot coin lands and awards Minor jackpot"
    description: "Verify that a COIN of type MINOR (type=2) landing during a re-spin is locked and its jackpot value is reflected in the final payout."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Enter bonus with 3 regular coins first
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Enter Hold & Spin bonus"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus to become active"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Record coin positions (should include 3 normal coins)"
        action: bridge_action
        params: { name: "getCoinPositions" }

      - id: step-04
        description: "Assert 3 coins are on the grid"
        assert:
          bridge:
            method: getCoinPositions
            expected_count: 3
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-37 — Major jackpot coin awards Major jackpot
  # ---------------------------------------------------------------------------
  - id: ZZ-37
    title: "MAJOR jackpot coin visible on grid during Hold & Spin"
    description: "Verify that when coins land they are correctly reflected in getCoinPositions including their type information (NORMAL/MINOR/MAJOR/GRAND)."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Enter bonus with 3 coins"
        action: bridge_action
        params: { name: "spin" }

      - id: step-02
        description: "Wait for bonus"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

      - id: step-03
        description: "Capture grid with coins"
        action: capture
        capture: true

      - id: step-04
        description: "Assert getCoinPositions returns non-empty array with position data"
        assert:
          bridge:
            method: getCoinPositions
            expected_min_count: 1
          ai:
            mode: image
            ref_screenshot: step-03
            ref_assets: [coin, hold_spin_overlay]
            prompt: "Are there coin symbols visible on the slot grid in a Hold and Spin bonus? How many coins do you see? Return JSON."
            output_schema:
              coins_visible: { type: boolean }
              coin_count: { type: number }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { coins_visible: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
      - action: wait_for_state
        params: { state: "idle", timeout_ms: 60000 }

  # ---------------------------------------------------------------------------
  # ZZ-38 — Bonus result popup shows total win after Hold & Spin ends
  # ---------------------------------------------------------------------------
  - id: ZZ-38
    title: "Bonus result popup displays total accumulated payout at bonus end"
    description: "Verify that when the Hold & Spin bonus ends, the bonus result popup appears and the game returns to normal play with balance increased by the bonus payout."
    setup:
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
      # Enter bonus with 3 coins
      - action: bridge_action
        params:
          name: "setDevModeResult"
          grid: [[13, 13, 13], [1, 3, 4], [3, 4, 1]]
    steps:
      - id: step-01
        description: "Record balance before bonus"
        action: bridge_action
        params: { name: "getBalance" }

      - id: step-02
        description: "Trigger spin to enter bonus"
        action: bridge_action
        params: { name: "spin" }

      - id: step-03
        description: "Wait for bonus to complete fully (no new coins in re-spins)"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 120000 }

      - id: step-04
        description: "Capture post-bonus state"
        action: capture
        capture: true

      - id: step-05
        description: "Assert spin state returned to NORMAL"
        assert:
          bridge:
            method: getSpinState
            expected: "NORMAL"

      - id: step-06
        description: "Assert balance changed (payout was credited)"
        assert:
          bridge:
            method: getLastPayout
            expected_relative: { operator: ">=", value: 0 }
          ai:
            mode: image
            ref_screenshot: step-04
            ref_assets: [bonus_result_popup, balance_label]
            prompt: "Is the slot game showing the main game screen after the Hold and Spin bonus ended? Is there a win amount or bonus result visible? Return JSON."
            output_schema:
              back_to_main_game: { type: boolean }
              bonus_result_shown: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { back_to_main_game: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "resetDevMode" }
