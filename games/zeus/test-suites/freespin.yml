            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-03
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-04
            description: "Vacuously valid (no respins) — kept per bridge-api §3.9"
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-05
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            description: "AI: 9 coins fill the grid, total-win popup, return to base (no respins)"
            assert:
