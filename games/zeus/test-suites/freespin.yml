                  confidence: { type: string, enum: [high, medium, low] }
                expected: { grid_filled_9_coins: true, total_win_popup_shown: true, returned_to_base_game: true, confidence: high }
          - id: step-08
            description: "Acknowledge the total-win popup"
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: step-09
            description: "Back in base game"
            assert:
              bridge:
                method: getAppState
                expected: "idle"
        teardown:
