  - id: fs-trigger9
    title: "9-coin instant trigger"
    setup:
      - id: gsetup-01
        description: "Force a 9-coin instant-fill trigger for this group"
        action: bo_paytable_update
        params: { paytable_code: AutomationTest, paytable_ref: fs-trigger9 }
    teardown: []
    tests:

      # ---------------------------------------------------------------------
      - id: ZZ-31
        title: "Trigger with 9 coins -> total payout popup -> back to base game"
        description: "The trigger spin itself lands 9 coins (full grid), entering and instantly ending the bonus with a total-win popup, then returning to base game. One blocking spin guarantees exactly one bonus (spinUntilBonus would race the instant end)."
