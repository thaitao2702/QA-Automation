          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "One blocking spin -> 9 coins -> instant bonus -> resolves at idle"
            action: bridge_action
            params: { name: spin, args: [] }
