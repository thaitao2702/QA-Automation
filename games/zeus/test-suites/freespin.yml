# Free Spin (Hold & Spin) Bonus suite — Zeus
# Source: D:/Project/qa-platform/test-case.xlsx, rows ZZ-30..ZZ-38 (Category: Free Spin)
# Generated by /write-test on 2026-06-05. Plan: freespin.plan.json
#
# Zeus "Free Spin" IS a Hold & Spin coin-collection bonus: coins are held, the
# re-spin counter starts at 3, resets to 3 when a new coin lands, decrements when
# none do, and the bonus ends at counter 0 OR a full 9-coin grid.
#
# Determinism: results are SERVER-authoritative via a back-office paytable. Per
# bridge-api.md §2.20, multi-respin bonus sequences must NOT use setDevModeResult
# (client injection) — a tuned BO paytable is required. Tests are grouped so the
# paytable is set once per group. Every test runs the three required Hold & Spin
# analysers (bridge-api.md §3.9) plus a video/image AI assertion.
#
# Bonus completion is awaited with the bridge waitForIdle() (no explicit timeout) —
# it resolves on the true idle state (deterministic), not a fixed sleep.

suite: "Free Spin (Hold & Spin) Bonus — ZZ-30 to ZZ-38"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 120000
  suite_timeout_ms: 1800000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - id: setup-01
    description: "Ensure the automation paytable exists on the master game"
    action: bo_paytable_ensure
    params: { paytable_code: AutomationTest }
  - id: setup-02
    description: "Point this agent's game at the automation paytable"
    action: bo_paytable_select
    params: { paytable_code: AutomationTest }
  - id: setup-03
    description: "Open the game (URL + ?bridge=1 resolved from env config)"
    action: navigate
    params: { url_script: "get_game_url" }
  - id: setup-04
    description: "Wait for the bridge to register at READY"
    action: wait_for_state
    params: { state: ready, timeout_ms: 30000 }
  - id: setup-05
    description: "Click Start and wait for the gameplay scene to be fully ready"
    action: bridge_action
    params: { name: startGame, args: [] }

teardown:
  - id: teardown-01
    description: "Restore the agent's game to its default paytable"
    action: bo_paytable_reset

groups:

  # =========================================================================
  # GROUP: fs-trigger3-countdown
  #   BaseGame  -> column 0 collapsed to COIN-only => exactly 3 coins / 3-coin trigger
  #   FreeSpin  -> CoinWeight collapsed to 0 => no new coin per respin =>
  #               counter 3->2->1->0, bonus ends by running out of spins.
  # =========================================================================
  - id: fs-trigger3-countdown
    title: "3-coin trigger, respins count down (no new coin)"
    setup:
      - id: gsetup-01
        description: "Force 3-coin trigger + count-down respins for this group"
        action: bo_paytable_update
        params: { paytable_code: AutomationTest, paytable_ref: fs-trigger3-countdown }
    teardown: []
    tests:

      # ---------------------------------------------------------------------
      - id: ZZ-30
        title: "Trigger FS with 3 coins -> 3 free spins granted"
        description: "Landing exactly 3 COIN symbols starts the Hold & Spin bonus with 3 free spins. Read freespins at the bonus-entry pause (race-safe), then capture the full bonus and run the three invariant analysers."
        setup:
          - id: setup-01
            description: "Start an independent capture buffer for this bonus"
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Spin until bonus; pauses at START_BONUS (triggers on spin 1 under the forced paytable)"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "At the bonus-entry pause, free spins remaining is 3"
            assert:
              bridge:
                method: getFreeSpinsRemaining
                expected: 3
          - id: step-03
            description: "Let the bonus play out; wait for the end-of-bonus total-win popup to appear"
            action: bridge_action
            params: { name: waitForTotalWinPopup, args: [] }
          - id: step-04
            description: "Return to base-game idle — the total-win popup self-dismisses after its animation (no skipTotalWin needed; that action is gated by its own totalWin.show busy-op)"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-05
            description: "Stop the capture; keep the raw event stream"
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-06
            description: "Slice the START_BONUS..END_BONUS episode"
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-07
            description: "Invariant: coins stay locked across respins"
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "Invariant: a new coin resets the counter to 3"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-09
            description: "Invariant: no new coin decrements the counter by 1 (3->2->1->0 confirms start=3)"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-10
            description: "AI: the game entered the bonus showing 3 coins and a re-spin counter of 3"
            assert:
              ai:
                mode: video
                # Trim to the bonus-entry pause only (spinUntilBonus halts at START_BONUS
                # with the counter at 3); step-03 onward plays the respins down to 0, which
                # would make the AI read the counter mid-count-down (e.g. 2) instead of 3.
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [symbols.coin, ui_elements.free_spin_counter, ui.free_spin]
                prompt: "Watch the spin trigger the Hold & Spin bonus. Did the game enter the bonus screen? How many gold coins are locked on the 3x3 grid at the start of the bonus? What number does the re-spin counter show when the bonus begins?"
                output_schema:
                  entered_bonus: { type: boolean }
                  coin_count: { type: number }
                  respin_counter: { type: number }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { entered_bonus: true, coin_count: 3, respin_counter: 3, confidence: high }
        teardown:
          - id: teardown-01
            description: "Acknowledge any total-win popup"
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            description: "Return to clean idle baseline"
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-32
        title: "Coins held fixed across all re-spins"
        description: "Every coin present on a respin remains at the same (col,row) with the same tier on the next respin. verifyHoldSpinCoinsHeld owns the verdict; the AI confirms the coins are visually frozen."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play the bonus out to idle"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            description: "Headline: coins held in place (no missing / tier_changed)"
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "AI: locked coins never move or disappear across respins"
            assert:
              ai:
                mode: video
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [symbols.coin, ui.free_spin]
                prompt: "Across the re-spins of this Hold & Spin bonus, do the 3 gold coins stay locked in the exact same grid positions? Did any locked coin move to a different cell or disappear?"
                output_schema:
                  coins_stay_locked: { type: boolean }
                  coins_moved_or_lost: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { coins_stay_locked: true, coins_moved_or_lost: false, confidence: high }
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-33
        title: "Only non-coin cells re-spin (coin cells stay)"
        description: "Each re-spin only re-rolls the cells WITHOUT a coin; cells holding coins are static. A held coin cell that re-spun would surface as missing/moved in verifyHoldSpinCoinsHeld."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play the bonus out to idle"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            description: "Headline: coin cells unchanged => only non-coin cells re-spun"
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "AI: only non-coin cells animate; coin cells stay frozen"
            assert:
              ai:
                mode: video
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [symbols.coin, ui.free_spin]
                prompt: "During each re-spin of this Hold & Spin bonus, do ONLY the cells without a coin spin/animate, while the cells holding gold coins stay completely still? Did any coin cell re-spin?"
                output_schema:
                  only_noncoin_cells_spin: { type: boolean }
                  coin_cell_respun: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { only_noncoin_cells_spin: true, coin_cell_respun: false, confidence: high }
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-35
        title: "No new coin -> spin until FS runs out"
        description: "With no new coin landing, the counter decrements by exactly 1 each respin (3->2->1->0) and the bonus ends by running out of free spins."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play the bonus out to idle"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            description: "Headline: each no-new-coin respin decrements freespins by 1"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            description: "Vacuously valid here (no new coins) — kept per bridge-api §3.9"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "AI: counter counts down 3->2->1->0 and never resets"
            assert:
              ai:
                mode: video
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [ui_elements.free_spin_counter, ui.free_spin]
                prompt: "Watch the re-spin counter through this Hold & Spin bonus. Does it count down 3 then 2 then 1 then 0 (one step per re-spin), never resetting back to 3, and then the bonus ends?"
                output_schema:
                  counted_down_to_zero: { type: boolean }
                  ever_reset: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { counted_down_to_zero: true, ever_reset: false, confidence: high }
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-36
        title: "FS runs out -> total payout popup -> back to base game"
        description: "When the counter reaches 0 the bonus ends, a total-win / bonus-result popup shows the accumulated payout, and the game returns to base game idle."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play the bonus out to idle (counter hits 0)"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            description: "Confirm the bonus ran out of spins (count-down to 0)"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "AI: total-win popup at the end, then return to base-game reels"
            assert:
              ai:
                mode: video
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [ui_elements.bonus_result_popup, ui.free_spin]
                prompt: "When the re-spin counter reached 0, did a bonus-result / total-win popup appear showing the accumulated payout, and did the game then return to the base-game reels?"
                output_schema:
                  total_win_popup_shown: { type: boolean }
                  returned_to_base_game: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { total_win_popup_shown: true, returned_to_base_game: true, confidence: high }
          - id: step-09
            description: "Acknowledge the total-win popup"
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: step-10
            description: "Game is back in base game, ready for the next spin"
            assert:
              bridge:
                method: getAppState
                expected: "idle"
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-38
        title: "Bet +/- and Autoplay disabled during FS"
        description: "While the Hold & Spin bonus is active the bet +/- and Autoplay controls are non-interactable. spinUntilBonus pauses inside the bonus so the live canDo-backed getters can be read; the bonus is then released to finish."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Pause INSIDE the bonus (isOnBonusGame=true), do not block to the end"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Screenshot the active bonus screen for the AI check"
            action: capture
          - id: step-03
            description: "Bet + button disabled during the bonus"
            assert:
              bridge:
                method: isNextBetEnabled
                expected: false
          - id: step-04
            description: "Bet - button disabled during the bonus"
            assert:
              bridge:
                method: isPreviousBetEnabled
                expected: false
          - id: step-05
            description: "Autoplay button disabled during the bonus"
            assert:
              bridge:
                method: isAutoEnabled
                expected: false
          - id: step-06
            description: "AI: bonus screen active with +/- and Autoplay greyed out"
            assert:
              ai:
                mode: image
                ref_screenshot: step-02
                assets: [ui.free_spin, ui_elements.free_spin_counter, ui_elements.bet_label, ui_elements.auto_button]
                prompt: "Is the Hold & Spin bonus screen active (re-spin counter visible on a grid of locked coins)? Are the bet + and bet - buttons and the Autoplay button greyed-out / disabled?"
                output_schema:
                  bonus_screen_active: { type: boolean }
                  bet_buttons_disabled: { type: boolean }
                  autoplay_disabled: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { bonus_screen_active: true, bet_buttons_disabled: true, autoplay_disabled: true, confidence: high }
          - id: step-07
            description: "Release the pause — let the bonus play out to idle"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-08
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-09
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-10
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-11
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-12
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

  # =========================================================================
  # GROUP: fs-trigger3-addcoin
  #   BaseGame  -> column 0 collapsed to COIN-only => 3-coin trigger
  #   FreeSpin  -> CoinWeight collapsed to TotalCoinWeight (1000) => a new coin
  #               lands every respin => counter resets to 3 and coins accumulate
  #               until the 9-cell grid is full (early end).
  # =========================================================================
  - id: fs-trigger3-addcoin
    title: "3-coin trigger, new coin every re-spin (reset + fill to 9)"
    setup:
      - id: gsetup-01
        description: "Force 3-coin trigger + a new coin on every respin for this group"
        action: bo_paytable_update
        params: { paytable_code: AutomationTest, paytable_ref: fs-trigger3-addcoin }
    teardown: []
    tests:

      # ---------------------------------------------------------------------
      - id: ZZ-34
        title: "New coin appears -> coin held + FS counter resets to 3"
        description: "When a re-spin lands a new coin, freespins resets to 3 and the new coin is locked for the rest of the bonus."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play the bonus out to idle (a new coin lands each respin)"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            description: "Headline: every respin that lands a new coin resets freespins to 3"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            description: "Newly landed coins are also held for the rest of the bonus"
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            description: "Vacuously valid (no no-coin respins) — kept per bridge-api §3.9"
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
          - id: step-08
            description: "AI: a new coin lands and the counter snaps back to 3"
            assert:
              ai:
                mode: video
                video_trim: { from_step: step-01, to_step: step-02 }
                assets: [symbols.coin, ui_elements.free_spin_counter, ui.free_spin]
                prompt: "During this Hold & Spin bonus, when a new gold coin lands on a re-spin, does the re-spin counter jump back up to 3 (instead of continuing to count down), and does the newly landed coin stay locked in place?"
                output_schema:
                  counter_reset_to_3: { type: boolean }
                  new_coin_locked: { type: boolean }
                  confidence: { type: string, enum: [high, medium, low] }
                expected: { counter_reset_to_3: true, new_coin_locked: true, confidence: high }
        teardown:
          - id: teardown-01
            action: bridge_action
            params: { name: dismissPopups, args: [] }
          - id: teardown-02
            action: bridge_action
            params: { name: waitForIdle, args: [] }

      # ---------------------------------------------------------------------
      - id: ZZ-37
        title: "Reach 9 coins during FS -> stop immediately -> total payout -> base"
        description: "Coins accumulate every re-spin until the 9-cell grid fills, ending the bonus EARLY (even with re-spins remaining), then a total-win popup shows and the game returns to base game."
        setup:
          - id: setup-01
            action: bridge_action
            params: { name: startEventCapture, args: ["bonus"] }
        steps:
          - id: step-01
            description: "Trigger the bonus; pause at START_BONUS"
            action: bridge_action
            params: { name: spinUntilBonus, args: [{ maxSpins: 5 }] }
          - id: step-02
            description: "Play out to idle — grid fills to 9 and ends early"
            action: bridge_action
            params: { name: waitForIdle, args: [] }
          - id: step-03
            action: bridge_action
            params: { name: endEventCapture, args: ["bonus"] }
            save: raw
          - id: step-04
            action: bridge_action
            params: { name: filterBonusEvent, args: ["$raw"] }
            save: events
          - id: step-05
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinResetOnNewCoin
              args: ["$events"]
              path: valid
              expected: true
          - id: step-06
            action: bridge_assert
            params:
              method: verifyHoldSpinCoinsHeld
              args: ["$events"]
              path: valid
              expected: true
          - id: step-07
            action: bridge_assert
            params:
              method: verifyHoldSpinFreespinCountDown
              args: ["$events"]
              path: valid
              expected: true
