suite: "Turbo Mode & Sound Toggle"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 60000
  suite_timeout_ms: 600000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - action: navigate
    params: { url_script: "get_game_url" }
  - action: wait_for_state
    params: { state: "ready", timeout_ms: 15000 }
  - action: click
    params: { selector: "#start-button" }
  - action: wait_for_state
    params: { state: "idle", timeout_ms: 15000 }

teardown: []

tests:

  # ---------------------------------------------------------------------------
  # ZZ-22 — Turbo toggles on
  # Requires VIDEO AI: turbo shortens reel animation — only observable via video.
  # ---------------------------------------------------------------------------
  - id: ZZ-22
    title: "Turbo mode activates and shortens spin animation"
    description: "Verify setTurbo(true) sets isTurboActive=true and subsequent spin animation is visually shorter than a non-turbo spin."
    setup:
      - action: bridge_action
        params: { name: "setTurbo", enabled: false }
      - action: bridge_action
        params: { name: "selectBet", index: 0 }
    steps:
      - id: step-01
        description: "Enable turbo mode"
        action: bridge_action
        params: { name: "setTurbo", enabled: true }

      - id: step-02
        description: "Assert turbo is active"
        assert:
          bridge:
            method: isTurboActive
            expected: true

      - id: step-03
        description: "Trigger a spin in turbo mode"
        action: bridge_action
        params: { name: "spin" }

      - id: step-04
        description: "Wait for turbo spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 15000 }

      - id: step-05
        description: "Assert turbo spin animation was visually fast (VIDEO AI)"
        assert:
          ai:
            mode: video
            video_trim:
              from_step: step-03
              to_step: step-04
            ref_assets: [turbo_on_indicator, spin_button]
            prompt: |
              Watch this slot machine spin. Turbo mode was enabled.
              1. Did the reels spin and stop?
              2. Did the reel animation appear faster/shorter than a normal spin (typically under 1 second total)?
              3. Is there a turbo indicator visible on screen?
              Return JSON.
            output_schema:
              reels_spun: { type: boolean }
              animation_fast: { type: boolean }
              turbo_indicator_visible: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { reels_spun: true, animation_fast: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "setTurbo", enabled: false }

  # ---------------------------------------------------------------------------
  # ZZ-23 — Turbo toggles off
  # ---------------------------------------------------------------------------
  - id: ZZ-23
    title: "Turbo mode deactivates correctly"
    description: "Verify setTurbo(false) after turbo was active sets isTurboActive to false."
    setup:
      - action: bridge_action
        params: { name: "setTurbo", enabled: true }
    steps:
      - id: step-01
        description: "Confirm turbo is currently on before toggling off"
        assert:
          bridge:
            method: isTurboActive
            expected: true

      - id: step-02
        description: "Disable turbo mode"
        action: bridge_action
        params: { name: "setTurbo", enabled: false }

      - id: step-03
        description: "Assert turbo is now off"
        assert:
          bridge:
            method: isTurboActive
            expected: false
    teardown: []

  # ---------------------------------------------------------------------------
  # ZZ-24 — Sound mutes correctly
  # Requires VIDEO AI: mute state shown via UI indicator not queryable via bridge alone.
  # Bridge isSoundEnabled query used for fast assert; AI confirms visual indicator.
  # ---------------------------------------------------------------------------
  - id: ZZ-24
    title: "Sound mutes when setSound(false) is called"
    description: "Verify setSound(false) disables both sound and music, reflected in isSoundEnabled and isMusicEnabled, and the muted indicator is visible on screen."
    setup:
      - action: bridge_action
        params: { name: "setSound", enabled: true }
    steps:
      - id: step-01
        description: "Mute sound"
        action: bridge_action
        params: { name: "setSound", enabled: false }

      - id: step-02
        description: "Capture screen after mute"
        action: capture
        capture: true

      - id: step-03
        description: "Assert sound is disabled via bridge"
        assert:
          bridge:
            method: isSoundEnabled
            expected: false

      - id: step-04
        description: "Assert music is disabled via bridge"
        assert:
          bridge:
            method: isMusicEnabled
            expected: false

      - id: step-05
        description: "Assert muted indicator is visible (IMAGE AI)"
        assert:
          ai:
            mode: image
            ref_screenshot: step-02
            ref_assets: [sound_muted_indicator]
            prompt: "Is a sound muted or sound-off icon visible on the game screen? Return JSON."
            output_schema:
              muted_icon_visible: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { muted_icon_visible: true, confidence: high }
    teardown:
      - action: bridge_action
        params: { name: "setSound", enabled: true }

  # ---------------------------------------------------------------------------
  # ZZ-25 — Sound unmutes correctly
  # ---------------------------------------------------------------------------
  - id: ZZ-25
    title: "Sound unmutes when setSound(true) is called"
    description: "Verify setSound(true) after mute re-enables sound and music, and the muted indicator disappears."
    setup:
      - action: bridge_action
        params: { name: "setSound", enabled: false }
    steps:
      - id: step-01
        description: "Confirm sound is muted before unmuting"
        assert:
          bridge:
            method: isSoundEnabled
            expected: false

      - id: step-02
        description: "Unmute sound"
        action: bridge_action
        params: { name: "setSound", enabled: true }

      - id: step-03
        description: "Capture screen after unmute"
        action: capture
        capture: true

      - id: step-04
        description: "Assert sound is enabled"
        assert:
          bridge:
            method: isSoundEnabled
            expected: true

      - id: step-05
        description: "Assert music is enabled"
        assert:
          bridge:
            method: isMusicEnabled
            expected: true

      - id: step-06
        description: "Assert muted indicator is gone (IMAGE AI)"
        assert:
          ai:
            mode: image
            ref_screenshot: step-03
            ref_assets: [sound_muted_indicator]
            prompt: "Is the sound muted icon absent or hidden? Is the game showing an unmuted/sound-on state? Return JSON."
            output_schema:
              muted_icon_absent: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { muted_icon_absent: true, confidence: high }
    teardown: []
