  # =========================================================================
  # ZZ-30 — Trigger Free Spin (3-8 Coins)
  # =========================================================================
  # NOTE: spin() waits for the entire bonus round to finish (IDLE).
  # After spin() resolves, the bonus is complete — getSpinState is END_BONUS
  # (or NORMAL after a tick), freeSpinsRemaining is 0. We verify post-bonus
  # state: balance increased, coins were present, game returned to idle.
  # =========================================================================
  - id: ZZ-30
    title: "Trigger Free Spin (3-8 Coins)"
    description: "Verify Hold & Spin triggers with 3 coins and completes with payout"
    setup:
      - id: setup-01
        description: "Inject 3 coins on top row"
        action: bridge_action
        params: { name: setDevModeResult, grid: [[13,13,13],[1,1,1],[3,3,3]] }
    steps:
      - id: step-01
        description: "Capture balance before spin"
        action: bridge_action
        params: { name: getBalance }
      - id: step-02
        description: "Capture bet amount"
        action: bridge_action
        params: { name: getBetAmount }
      - id: step-03
        description: "Trigger spin (120s timeout — bonus round takes 30-70s)"
        action: bridge_action
        params: { name: spin, timeoutMs: 120000 }
      - id: step-04
        description: "Verify game returned to idle after bonus"
        action: bridge_assert
        params:
          method: getAppState
          expected: "idle"
      - id: step-05
        description: "Verify bonus completed (re-spins exhausted)"
        action: bridge_assert
        params:
          method: getFreeSpinsRemaining
          expected: 0
      - id: step-06
        description: "Capture payout from bonus"
        action: bridge_action
        params: { name: getLastPayout }
      - id: step-07
        description: "Verify bonus paid out"
        action: script
        params:
          cmd: "assert(steps['step-06'].result > 0, 'Expected bonus payout > 0 but got ' + steps['step-06'].result)"
      - id: step-08
        description: "Capture balance after bonus"
        action: bridge_action
        params: { name: getBalance }
      - id: step-09
        description: "Verify balance increased (bonus payout added)"
        action: script
        params:
          cmd: >
            const before = steps['step-01'].result;
            const after = steps['step-08'].result;
            const bet = steps['step-02'].result;
            const payout = steps['step-06'].result;
            assert(after > before - bet,
              'Balance should increase from bonus. Before=' + before + ' After=' + after + ' Bet=' + bet + ' Payout=' + payout)
      - id: step-10
        description: "Verify spin button re-enabled"
        action: bridge_assert
        params:
          method: isSpinEnabled
          expected: true
      - id: step-11
        description: "AI video: verify full Hold & Spin bonus sequence"
        assert:
          ai:
            mode: video
            video_trim:
              from_step: step-03
              to_step: step-10
            ref_assets: [coin, hold_spin_overlay, spin_button, balance_label]
            prompt: "Watch the video of a slot game bonus round. Did the following sequence occur: 1) A spin was triggered 2) 3 or more coin symbols landed on the 3x3 grid 3) A Hold & Spin bonus mode started with coins locked on the grid 4) Re-spins occurred with a countdown counter 5) After re-spins finished, a total bonus payout was displayed 6) The game returned to normal idle state with the spin button visible?"
            output_schema:
              spin_triggered: { type: boolean }
              coins_landed: { type: boolean }
              bonus_mode_entered: { type: boolean }
              respins_occurred: { type: boolean }
              payout_displayed: { type: boolean }
              returned_to_idle: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected:
              spin_triggered: true
              coins_landed: true
              bonus_mode_entered: true
              respins_occurred: true
              payout_displayed: true
              returned_to_idle: true
              confidence: high
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: resetDevMode }

