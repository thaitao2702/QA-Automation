# =============================================================================
# Zeus — test3 suite
# Generated: 2026-04-12
# Source: test-case.xlsx (QA raw test cases)
# Approved: ZZ-02..ZZ-06, ZZ-09, ZZ-11, ZZ-13..ZZ-15, ZZ-17..ZZ-20, ZZ-22,
#           ZZ-26..ZZ-27, ZZ-30..ZZ-32
# Skipped:  ZZ-01 (user skip), ZZ-07/ZZ-08/ZZ-16 (no setBalance in bridge),
#           ZZ-10 (backoffice), ZZ-21 (user skip), ZZ-23 (tab switch),
#           ZZ-24/ZZ-25 (user skip), ZZ-28 (wifi), ZZ-29 (multi-tab),
#           ZZ-33..ZZ-52 (not yet reviewed)
# =============================================================================

suite: "Comprehensive QA Test Cases"
game: zeus
version: "1.0"

config:
  detection_method: both
  video: true
  test_timeout_ms: 120000
  suite_timeout_ms: 1200000
  stop_conditions:
    fail_fast: false
    max_consecutive_failures: 3
    max_total_failures: 10

setup:
  - id: global-setup-01
    action: navigate
    params: { url_script: "get_game_url" }
  - id: global-setup-02
    action: wait_for_state
    params: { state: "ready", timeout_ms: 30000 }
  - id: global-setup-03
    action: bridge_action
    params: { name: "startGame" }

teardown: []

tests:

  # =========================================================================
  # ZZ-02 — Check Denomination
  # =========================================================================
  - id: ZZ-02
    title: "Check Denomination"
    description: "Verify denomination list loads and default bet is first denomination"
    setup: []
    steps:
      - id: step-01
        description: "Fetch denomination list from bridge"
        action: bridge_action
        params: { name: getDenominations }
      - id: step-02
        description: "Verify default bet is first denomination (index 0)"
        action: bridge_assert
        params:
          method: getBetIndex
          expected: 0
      - id: step-03
        description: "Capture actual bet amount"
        action: bridge_action
        params: { name: getBetAmount }
      - id: step-04
        description: "Capture displayed bet string"
        action: bridge_action
        params: { name: getDisplayBet }
      - id: step-05
        description: "Capture bet display"
        action: capture
      - id: step-06
        description: "Verify next bet enabled, previous disabled (at min)"
        assert:
          bridge:
            method: isNextBetEnabled
            expected: true
      - id: step-07
        action: bridge_assert
        params:
          method: isPreviousBetEnabled
          expected: false
      - id: step-08
        description: "Verify bet label is visible and properly formatted"
        assert:
          ai:
            mode: image
            ref_screenshot: step-05
            ref_assets: [bet_label]
            prompt: "Is the bet label clearly visible and displaying a properly formatted numeric value (e.g., 0.20 or 1.00 format with decimal places)?"
            output_schema:
              label_visible: { type: boolean }
              properly_formatted: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { label_visible: true, properly_formatted: true, confidence: high }
    teardown: []

  # =========================================================================
  # ZZ-03 — Increase/Decrease Bet
  # =========================================================================
  - id: ZZ-03
    title: "Increase/Decrease Bet"
    description: "Verify bet amount increases on nextBet and decreases on previousBet"
    setup: []
    steps:
      - id: step-01
        description: "Confirm starting at min bet"
        action: bridge_assert
        params:
          method: getBetIndex
          expected: 0
      - id: step-02
        description: "Capture initial display bet"
        action: bridge_action
        params: { name: getDisplayBet }
      - id: step-03
        description: "Screenshot before increase"
        action: capture
      - id: step-04
        description: "Increase bet"
        action: bridge_action
        params: { name: nextBet }
      - id: step-05
        description: "Verify index moved up"
        action: bridge_assert
        params:
          method: getBetIndex
          expected: 1
      - id: step-06
        description: "Capture new display bet"
        action: bridge_action
        params: { name: getDisplayBet }
      - id: step-07
        description: "Screenshot after increase"
        action: capture
      - id: step-08
        description: "AI: verify bet increased"
        assert:
          ai:
            mode: image
            ref_screenshot: [step-03, step-07]
            ref_assets: [bet_label]
            prompt: "Compare the bet value in these two images. Is the bet value in the second image higher than the first? Read both values."
            output_schema:
              increased: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { increased: true, confidence: high }
      - id: step-09
        description: "Decrease bet back"
        action: bridge_action
        params: { name: previousBet }
      - id: step-10
        description: "Verify index back to 0"
        action: bridge_assert
        params:
          method: getBetIndex
          expected: 0
      - id: step-11
        description: "Capture restored display bet"
        action: bridge_action
        params: { name: getDisplayBet }
      - id: step-12
        description: "Screenshot after decrease"
        action: capture
      - id: step-13
        description: "AI: verify bet decreased"
        assert:
          ai:
            mode: image
            ref_screenshot: [step-07, step-12]
            ref_assets: [bet_label]
            prompt: "Compare the bet value in these two images. Is the bet value in the second image lower than the first? Read both values."
            output_schema:
              decreased: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { decreased: true, confidence: high }
    teardown: []

  # =========================================================================
  # ZZ-04 — Default Bet Level
  # =========================================================================
  - id: ZZ-04
    title: "Default Bet Level"
    description: "Verify game loads with default bet level from server config"
    setup: []
    steps:
      - id: step-01
        description: "Get server game config"
        action: bridge_action
        params: { name: getGameInfo }
      - id: step-02
        description: "Verify default bet is first denomination"
        action: bridge_assert
        params:
          method: getBetIndex
          expected: 0
      - id: step-03
        description: "Capture actual bet amount"
        action: bridge_action
        params: { name: getBetAmount }
      - id: step-04
        description: "Capture displayed bet string"
        action: bridge_action
        params: { name: getDisplayBet }
      - id: step-05
        description: "Screenshot of default state"
        action: capture
      - id: step-06
        description: "Verify can increase but not decrease"
        assert:
          bridge:
            method: isNextBetEnabled
            expected: true
      - id: step-07
        action: bridge_assert
        params:
          method: isPreviousBetEnabled
          expected: false
      - id: step-08
        description: "Verify bet label visible and formatted"
        assert:
          ai:
            mode: image
            ref_screenshot: step-05
            ref_assets: [bet_label]
            prompt: "Is the bet label clearly visible and displaying a properly formatted numeric value (e.g., 0.20 or 1.00 format with decimal places)?"
            output_schema:
              label_visible: { type: boolean }
              properly_formatted: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { label_visible: true, properly_formatted: true, confidence: high }
    teardown: []

  # =========================================================================
  # ZZ-05 — Balance Deduction on Bet
  # =========================================================================
  - id: ZZ-05
    title: "Balance Deduction on Bet"
    description: "Verify balance decreases by bet amount after a no-win spin"
    setup:
      - id: setup-01
        description: "Inject no-win result"
        action: bridge_action
        # A row / Q row / K row — no payline match
        # !! AMBIGUITY: assumed no payline win. Confirm symbol IDs.
        params: { name: setDevModeResult, grid: [[1,1,1],[3,3,3],[4,4,4]] }
    steps:
      - id: step-01
        description: "Capture balance before spin"
        action: bridge_action
        params: { name: getBalance }
      - id: step-02
        description: "Capture bet amount"
        action: bridge_action
        params: { name: getBetAmount }
      - id: step-03
        description: "Screenshot before spin"
        action: capture
      - id: step-04
        description: "Spin with injected no-win result"
        action: bridge_action
        params: { name: spin }
      - id: step-05
        description: "Wait for spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }
      - id: step-06
        description: "Capture balance after spin"
        action: bridge_action
        params: { name: getBalance }
      - id: step-07
        description: "Confirm no win"
        action: bridge_assert
        params:
          method: getLastPayout
          expected: 0
      - id: step-08
        description: "Screenshot after spin"
        action: capture
      - id: step-09
        description: "AI: verify balance decreased"
        assert:
          ai:
            mode: image
            ref_screenshot: [step-03, step-08]
            ref_assets: [balance_label]
            prompt: "Compare the balance value in these two images. Is the balance in the second image lower than the first? Read both balance values."
            output_schema:
              balance_decreased: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { balance_decreased: true, confidence: high }
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: resetDevMode }

  # =========================================================================
  # ZZ-06 — Add Payout After Spin
  # =========================================================================
  - id: ZZ-06
    title: "Add Payout After Spin"
    description: "Verify balance increases when spin produces a win"
    setup:
      - id: setup-01
        description: "Inject winning result (3x P1 Crow on top row = payline 2)"
        action: bridge_action
        params: { name: setDevModeResult, grid: [[5,5,5],[5,1,1],[5,3,3]] }
    steps:
      - id: step-01
        description: "Capture balance before"
        action: bridge_action
        params: { name: getBalance }
      - id: step-02
        description: "Capture bet amount"
        action: bridge_action
        params: { name: getBetAmount }
      - id: step-03
        description: "Screenshot before spin"
        action: capture
      - id: step-04
        description: "Spin with injected win"
        action: bridge_action
        params: { name: spin }
      - id: step-05
        description: "Wait for spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }
      - id: step-06
        description: "Capture payout"
        action: bridge_action
        params: { name: getLastPayout }
      - id: step-06b
        description: "Assert payout is positive (win occurred)"
        action: script
        params:
          cmd: "assert(steps['step-06'].result > 0, 'Expected positive payout but got ' + steps['step-06'].result)"
      - id: step-07
        description: "Capture balance after"
        action: bridge_action
        params: { name: getBalance }
      - id: step-08
        description: "Capture win type"
        action: bridge_action
        params: { name: getLastWinType }
      - id: step-08b
        description: "Assert win type is not LOSE"
        action: script
        params:
          cmd: "assert(steps['step-08'].result !== 'LOSE', 'Expected a win but got ' + steps['step-08'].result)"
      - id: step-09
        description: "Screenshot after spin"
        action: capture
      - id: step-10
        description: "AI: verify balance increased and win displayed"
        assert:
          ai:
            mode: image
            ref_screenshot: [step-03, step-09]
            ref_assets: [balance_label, win_label]
            prompt: "Compare the balance value in these two images. Is the balance in the second image higher than the first? Is a win amount displayed on the win label?"
            output_schema:
              balance_increased: { type: boolean }
              win_displayed: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { balance_increased: true, win_displayed: true, confidence: high }
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: resetDevMode }

  # =========================================================================
  # ZZ-09 — History in Game
  # =========================================================================
  - id: ZZ-09
    title: "History in Game"
    description: "Verify history popup shows bet records after completing a spin"
    setup: []
    steps:
      - id: step-01
        description: "Complete one bet"
        action: bridge_action
        params: { name: spin }
      - id: step-02
        description: "Wait for spin to complete"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }
      - id: step-03
        description: "Open history popup"
        action: bridge_action
        params: { name: openHistory }
      - id: step-04
        description: "Wait for popup to render"
        action: wait_ms
        params: { ms: 1000 }
      - id: step-05
        description: "Screenshot of history popup"
        action: capture
      - id: step-06
        description: "Verify history popup visible with bet records"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
          ai:
            mode: image
            ref_screenshot: step-05
            prompt: "Is a history popup visible on screen? Does it show at least one bet record with bet amount, payout, and round information?"
            output_schema:
              popup_visible: { type: boolean }
              has_bet_record: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { popup_visible: true, has_bet_record: true, confidence: high }
    teardown:
      - id: teardown-01
        description: "Reload game to close popup"
        action: navigate
        params: { url_script: "get_game_url" }
      - id: teardown-02
        action: wait_for_state
        params: { state: "ready", timeout_ms: 30000 }
      - id: teardown-03
        action: bridge_action
        params: { name: "startGame" }

  # =========================================================================
  # ZZ-11 — Check UI Paytable
  # =========================================================================
  - id: ZZ-11
    title: "Check UI Paytable"
    description: "Verify paytable popup displays symbol payouts and payline info"
    setup: []
    steps:
      - id: step-01
        description: "Open paytable tab via openInfo (SettingPopup page 2)"
        action: bridge_action
        params: { name: openInfo }
      - id: step-02
        description: "Wait for settings popup to render"
        action: wait_ms
        params: { ms: 1000 }
      - id: step-03
        description: "Screenshot of paytable tab"
        action: capture
      - id: step-04
        description: "Verify paytable tab is showing inside settings popup"
        assert:
          bridge:
            method: getAppState
            expected: "idle"
          ai:
            mode: image
            ref_screenshot: step-03
            prompt: "Is a settings/info popup open? Is it showing the paytable or game info tab? This popup has multiple tabs (Settings, History, Info/Paytable, Game Limit). Look for symbol images with numeric payout values, payline diagrams, or game rules text."
            output_schema:
              settings_popup_open: { type: boolean }
              paytable_tab_visible: { type: boolean }
              has_symbol_payouts: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { settings_popup_open: true, paytable_tab_visible: true, has_symbol_payouts: true, confidence: high }
    teardown:
      - id: teardown-01
        description: "Reload game to close popup"
        action: navigate
        params: { url_script: "get_game_url" }
      - id: teardown-02
        action: wait_for_state
        params: { state: "ready", timeout_ms: 30000 }
      - id: teardown-03
        action: bridge_action
        params: { name: "startGame" }

  # =========================================================================
  # ZZ-13 — Enable Auto
  # =========================================================================
  - id: ZZ-13
    title: "Enable Auto"
    description: "Verify auto-spin starts and stop button becomes visible"
    setup: []
    steps:
      - id: step-01
        description: "Verify auto button enabled"
        action: bridge_assert
        params:
          method: isAutoEnabled
          expected: true
      - id: step-02
        description: "Open auto popup"
        action: bridge_action
        params: { name: openAutoPopup }
      - id: step-03
        description: "Start 10 auto spins"
        action: bridge_action
        params: { name: startAutoSpin, count: 10, stopByWin: false }
      - id: step-04
        description: "Wait for first spin to start"
        action: wait_ms
        params: { ms: 2000 }
      - id: step-05
        description: "Verify stop auto button visible"
        action: bridge_assert
        params:
          method: isStopAutoVisible
          expected: true
      - id: step-06
        description: "Capture remaining count"
        action: bridge_action
        params: { name: getAutoSpinsRemaining }
      - id: step-07
        description: "Screenshot during auto"
        action: capture
      - id: step-08
        description: "AI: verify auto mode active"
        assert:
          ai:
            mode: image
            ref_screenshot: step-07
            ref_assets: [stop_auto_button]
            prompt: "Is the game currently in auto-spin mode? Is a stop button or auto-spin counter visible instead of the normal spin button?"
            output_schema:
              auto_mode_active: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { auto_mode_active: true, confidence: high }
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: stopAutoSpin }
      - id: teardown-02
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }

  # =========================================================================
  # ZZ-14 — Stop by Spin Count
  # =========================================================================
  # NOTE: During auto-spin the game loops BETTING → RESULT → BETTING → ...
  # without transitioning to IDLE between spins. IDLE only fires after the
  # last auto-spin completes. Do NOT wait_for_state idle/betting per spin.
  # =========================================================================
  - id: ZZ-14
    title: "Stop by Spin Count"
    description: "Verify auto-spin stops automatically after 10 spins complete"
    setup:
      - id: setup-01
        description: "Enable turbo for faster spins"
        action: bridge_action
        params: { name: setTurbo, enabled: true }
    steps:
      - id: step-01
        description: "Record balance before auto-spin"
        action: bridge_action
        params: { name: getBalance }
      - id: step-02
        description: "Open auto popup"
        action: bridge_action
        params: { name: openAutoPopup }
      - id: step-03
        description: "Start 10 auto spins"
        action: bridge_action
        params: { name: startAutoSpin, count: 10, stopByWin: false }
      - id: step-04
        description: "Wait briefly then verify auto is running"
        action: wait_ms
        params: { ms: 2000 }
      - id: step-05
        description: "Confirm stop auto button visible (auto running)"
        action: bridge_assert
        params:
          method: isStopAutoVisible
          expected: true
      - id: step-06
        description: "Screenshot during auto-spin"
        action: capture
      - id: step-07
        description: "Wait for all 10 spins to complete (IDLE only fires after last spin)"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 90000 }
      - id: step-08
        description: "Verify auto-spin stopped"
        action: bridge_assert
        params:
          method: isStopAutoVisible
          expected: false
      - id: step-09
        description: "Verify spin count exhausted"
        action: bridge_assert
        params:
          method: getAutoSpinsRemaining
          expected: 0
      - id: step-10
        description: "Verify game returned to idle"
        action: bridge_assert
        params:
          method: getAppState
          expected: "idle"
      - id: step-11
        description: "Verify spin button re-enabled"
        action: bridge_assert
        params:
          method: isSpinEnabled
          expected: true
      - id: step-12
        description: "Record balance after auto-spin"
        action: bridge_action
        params: { name: getBalance }
      - id: step-13
        description: "Verify balance changed (10 spins should deduct)"
        action: script
        params:
          cmd: "assert(steps['step-12'].result !== steps['step-01'].result, 'Balance should have changed after 10 spins')"
      - id: step-14
        description: "Screenshot after auto finished"
        action: capture
      - id: step-15
        description: "AI: verify normal idle state restored"
        assert:
          ai:
            mode: image
            ref_screenshot: step-14
            ref_assets: [spin_button]
            prompt: "Is the game in normal idle state? Is the regular spin button visible (not a stop button or auto counter)?"
            output_schema:
              idle_state: { type: boolean }
              normal_spin_button: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { idle_state: true, normal_spin_button: true, confidence: high }
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: setTurbo, enabled: false }

  # =========================================================================
  # ZZ-15 — Stop at Any Win
  # =========================================================================
  - id: ZZ-15
    title: "Stop at Any Win"
    description: "Verify auto-spin stops when a win occurs with stopByWin enabled"
    setup:
      - id: setup-01
        description: "Enable turbo"
        action: bridge_action
        params: { name: setTurbo, enabled: true }
      - id: setup-02
        description: "Inject no-win for initial spins"
        action: bridge_action
        params: { name: setDevModeResult, grid: [[1,2,3],[3,2,2],[1,2,1]] }
    # NOTE: With stopByWin=true, auto-spin stops as soon as any spin wins.
    # The no-win devMode grid is consumed after 1 spin, so spin 2+ use server
    # results. Auto may stop very quickly if the server returns a win. We can't
    # guarantee auto is "still running" after any wait — just verify it stopped
    # early (remaining > 0) because of a win (payout > 0).
    steps:
      - id: step-01
        description: "Open auto popup"
        action: bridge_action
        params: { name: openAutoPopup }
      - id: step-02
        description: "Start auto with stopByWin=true"
        action: bridge_action
        params: { name: startAutoSpin, count: 10, stopByWin: true }
      - id: step-03
        description: "Wait for auto to stop (win triggers stop, or all 10 finish)"
        action: wait_for_state
        params: { state: "idle", timeout_ms: 90000 }
      - id: step-04
        description: "Verify auto stopped"
        action: bridge_assert
        params:
          method: isStopAutoVisible
          expected: false
      - id: step-05
        description: "Capture payout from last spin"
        action: bridge_action
        params: { name: getLastPayout }
      - id: step-06
        description: "Capture remaining auto spins"
        action: bridge_action
        params: { name: getAutoSpinsRemaining }
      - id: step-07
        description: "Verify auto completed (win stopped early OR all 10 finished)"
        action: script
        params:
          cmd: >
            const payout = steps['step-05'].result;
            const remaining = steps['step-06'].result;
            if (payout > 0 && remaining > 0) {
              // stopByWin triggered — win detected, stopped early
            } else if (remaining === 0) {
              // All 10 spins completed — no win occurred, stopByWin had nothing to stop on
            } else {
              assert(false, 'Unexpected state: payout=' + payout + ' remaining=' + remaining);
            }
      - id: step-08
        description: "Verify spin re-enabled"
        action: bridge_assert
        params:
          method: isSpinEnabled
          expected: true
      - id: step-09
        description: "Screenshot after auto stopped by win"
        action: capture
      - id: step-10
        description: "AI: verify idle with win displayed"
        assert:
          ai:
            mode: image
            ref_screenshot: step-09
            ref_assets: [spin_button, win_label]
            prompt: "Is the game in normal idle state? Is a win amount displayed on the win label? Is the regular spin button visible?"
            output_schema:
              idle_state: { type: boolean }
              win_displayed: { type: boolean }
              normal_spin_button: { type: boolean }
              confidence: { type: string, enum: [high, medium, low] }
            expected: { idle_state: true, win_displayed: true, normal_spin_button: true, confidence: high }
    teardown:
      - id: teardown-01
        action: bridge_action
        params: { name: resetDevMode }
      - id: teardown-02
        action: bridge_action
        params: { name: setTurbo, enabled: false }


  # =========================================================================
  # ZZ-17 — User Stop Auto
  # =========================================================================
  - id: ZZ-17
    title: "User Stop Auto"
    description: "Verify auto-spin stops immediately when user clicks stop"
    setup:
      - id: setup-01
        action: bridge_action
        params: { name: setTurbo, enabled: true }
    steps:
      - id: step-01
        description: "Open auto popup"
        action: bridge_action
        params: { name: openAutoPopup }
      - id: step-02
        description: "Start 10 auto spins"
        action: bridge_action
        params: { name: startAutoSpin, count: 10, stopByWin: false }
      - id: step-03
        description: "Wait for some auto spins to run"
        action: wait_ms
        params: { ms: 2000 }
      - id: step-04
        description: "Verify auto running"
        action: bridge_assert
        params:
          method: isStopAutoVisible
          expected: true
      - id: step-05
        description: "User stops auto"
        action: bridge_action
        params: { name: stopAutoSpin }
      - id: step-06
        action: wait_for_state
        params: { state: "idle", timeout_ms: 30000 }
      - id: step-07
