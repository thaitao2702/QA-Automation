# symbols.yml — Zeus slot game asset manifest.
# Generated by init-knowledge on 2026-04-12.
# Symbol IDs from Constants.ts SlotSymbol enum.
# Symbol names follow doc naming (Doc Zappin zeus.md).
# Files under symbols/ and ui/ must be placed here before running AI assertions.

symbols:

  # ---------------------------------------------------------------------------
  # Low-value card symbols
  # ---------------------------------------------------------------------------
  ace:
    file: symbols/Pentagon.jpg
    name: "Pentagon/Ace (A)"
    type: low
    # Symbol ID: 1
    description: "Card symbol A. Doc mapping: Pentagon."

  # jack (ID 2) is disabled in server config (weight=0 per Constants.ts SlotSymbol enum) —
  # the J symbol will never appear in a real spin result and is excluded from this manifest.
  # If the server config changes to re-enable J, add an entry here with file: symbols/J.jpg.

  queen:
    file: symbols/Triangle.jpg
    name: "Triangle/Queen (Q)"
    type: low
    # Symbol ID: 3
    description: "Card symbol Q. Doc mapping: Triangle."

  king:
    file: symbols/Diamon.jpg
    name: "Diamon/King (K)"
    type: low
    # Symbol ID: 4
    description: "Card symbol K. Doc mapping: Diamon."

  # ---------------------------------------------------------------------------
  # Premium / high-value symbols
  # ---------------------------------------------------------------------------
  crow:
    file: symbols/Crow.jpg
    name: "Crow (P1)"
    type: high
    # Symbol ID: 5
    description: "Crow symbol. Premium tier 1. Doc mapping: Crow."
    # image not yet added — add reference jpg for AI assertions

  cup:
    file: symbols/Cup.jpg
    name: "Cup (P2)"
    type: high
    # Symbol ID: 6
    description: "Cup symbol. Premium tier 2. Doc mapping: Cup."
    # image not yet added — add reference jpg for AI assertions

  ring:
    file: symbols/Ring.jpg
    name: "Ring (P3)"
    type: high
    # Symbol ID: 7
    description: "Ring symbol. Premium tier 3. Highest-paying regular symbol. Doc mapping: Ring."
    # image not yet added — add reference jpg for AI assertions

  time:
    file: symbols/Time.jpg
    name: "Time (P4)"
    type: high
    # Symbol ID: 8
    description: "Time symbol. Premium tier 4. Doc mapping: Time."
    # image not yet added — add reference jpg for AI assertions

  # ---------------------------------------------------------------------------
  # Special symbols
  # ---------------------------------------------------------------------------
  wild:
    file: symbols/Wild.jpg
    name: "Wild (Golden Eagle)"
    type: wild
    # Symbol ID: 9
    description: "Golden eagle with spread wings on a lightning-charged background. Substitutes for all symbols except Coin. Highest multiplier in paylines."

  coin:
    file: symbols/Coin.jpg
    name: "Coin (Hold & Spin)"
    type: bonus
    # Symbol ID: 13
    description: "Bronze-gold coin with a Zeus lightning bolt emblem and a numeric value or jackpot label. Landing 3 or more triggers the Hold and Spin bonus. Locked coins persist across re-spins."

# ---------------------------------------------------------------------------
# ui_elements — UI components referenced in state assertions
# ---------------------------------------------------------------------------

ui_elements:

  spin_button:
    file: ui/spin-button.jpg
    name: "Spin Button"
    type: ui
    description: "Large circular button at the bottom centre of the screen. Green/gold when active. Initiates a spin."

  stop_button:
    file: ui/stop-button.jpg
    name: "Stop Button"
    type: ui
    description: "Stop/skip button that appears during reel animation (result state). Skips reel animation to show result immediately."

  auto_button:
    file: ui/auto-button.jpg
    name: "Auto Spin Button"
    type: ui
    description: "Auto-spin toggle button. Opens the auto-spin configuration popup when clicked."

  stop_auto_button:
    file: ui/stop-auto-button.jpg
    name: "Stop Auto Button"
    type: ui
    description: "Replaces the auto button during an active auto-spin session. Cancels auto-spin when clicked."

  buy_bonus_button:
    file: ui/buy-bonus-button.jpg
    name: "Buy Bonus Button"
    type: ui
    description: "Displays the cost to purchase a guaranteed Hold and Spin bonus entry. Disabled during auto-spin, promo, and free-spin modes."

  balance_label:
    file: ui/balance-label.jpg
    name: "Balance Label"
    type: ui
    description: "Numeric display showing the player's current balance in the game currency. Format: X,XXX.XX"

  bet_label:
    file: ui/bet-label.jpg
    name: "Bet Label"
    type: ui
    description: "Numeric display showing the current bet amount. Format: X.XX"

  win_label:
    file: ui/win-label.jpg
    name: "Win Label"
    type: ui
    description: "Numeric display showing the payout from the last completed spin. Animates from 0 to the win amount on a winning spin."

  free_spin_counter:
    file: ui/free-spin-counter.jpg
    name: "Free Spin Counter"
    type: ui
    description: "Counter displayed during Hold and Spin bonus showing the remaining re-spin count (typically 3, resets on each new coin landing)."

  hold_spin_overlay:
    file: ui/hold-spin-overlay.jpg
    name: "Hold and Spin Overlay"
    type: ui
    description: "Full-screen overlay activated during the Hold and Spin bonus round. Shows locked coin positions on a 3x3 grid and the re-spin countdown."

  bonus_result_popup:
    file: ui/bonus-result-popup.jpg
    name: "Bonus Result Popup"
    type: ui
    description: "Popup displayed at the end of the Hold and Spin bonus showing the total accumulated payout from all locked coins."

  big_win_popup:
    file: ui/big-win-popup.jpg
    name: "Big Win Popup"
    type: ui
    description: "Full-screen celebration overlay for BIG WIN (10x bet), MEGA WIN (25x bet), or ULTRA WIN (50x+ bet). Shows animated counter counting up to the win amount."

  paytable_popup:
    file: ui/paytable-popup.jpg
    name: "Paytable / Info Popup"
    type: ui
    description: "Information popup showing symbol pay rates, payline definitions, and game rules. Opened via the info button."

  turbo_on_indicator:
    file: ui/turbo-on.jpg
    name: "Turbo On Indicator"
    type: ui
    description: "Visual indicator showing turbo mode is currently active. Reel animations are shortened in turbo mode."

  sound_muted_indicator:
    file: ui/sound-muted.jpg
    name: "Sound Muted Indicator"
    type: ui
    description: "Icon shown when both sound effects and music are muted."
