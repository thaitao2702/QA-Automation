# env.config.dev.yml — Treasures of the Dragon VIP, dev environment.
# Self-contained: only the dev environment's config. Loaded by the runner when
# invoked with --env dev (resolved via framework/env_files.py game_config_path).
#
# ⚠ INCOMPLETE ON PURPOSE. The VIP build's launch path, Playsite game code and BO ids are not known
# to this repo yet. Do NOT copy Dragon's values in: the runner would launch plain Dragon, which has no
# Ante Bet and no Premium Reel, and every mirrored DV case would grade the wrong game — some of them
# green. Left empty, the runner fails loudly instead. Fill every TODO before the first run.

# URL resolution: a non-empty 'url' is used directly (paste a fresh launch URL
# here for a quick manual run). Clear it (url: "") to fall back to 'url_script',
# which resolves the URL dynamically via the Playsite login flow.
base_url: "http://192.168.1.27:7456/web-mobile/sl_33_treasures_dragon_vip/index.html"            # TODO: the VIP dev build's index.html
url: ""
url_script: "python scripts/get_game_url_playsite.py --env=dev"
browser_params: "?bridge=1&debug=1"

# Playsite launch (game-specific). Used by url_script when resolving the URL:
# the runner injects these as PLAYSITE_GAME_CODE / PLAYSITE_CURRENCY. The
# Playsite API base + player credentials are NOT here — they are shared infra
# and live in the root .env overlay (PLAYSITE_API_URL / PLAYSITE_USER / PLAYSITE_PASS).
playsite:
  game_code: SL_33_TREASURES_DRAGON_VIP        # TODO: the VIP game code
  currency: TKN         # omit to use the player's default wallet

# Back-office identifiers for paytable control (bo_paytable_* steps).
# Every forced run in dv-holdspin.yml / dv-ante.yml pushes a games/dragon-vip/paytables/ fixture,
# which carries the Ante Bet and Premium Reel sections — pushed to plain Dragon's BO record it
# would configure features that game does not have.
bo:
  sas_entity_id: 1
  game_id: 283       # TODO
  agent_id: 1
  currency_id: 31
  game_code: SL_33_TREASURES_DRAGON_VIP         # TODO

# Symbol detection configuration.
detection:
  method: both
  phash_threshold: 10
  fallback: gemini
