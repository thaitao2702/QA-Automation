<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replay Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #header h1 { font-size: 0.95rem; font-weight: 600; }
  .meta { font-size: 0.8rem; color: #94a3b8; }
  .verdict-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .verdict-green  { background: #064e3b; color: #6ee7b7; }
  .verdict-orange { background: #431407; color: #fdba74; }
  .verdict-red    { background: #450a0a; color: #fca5a5; }
  .verdict-pending { background: #1e293b; color: #94a3b8; }
  .verdict-skip   { background: #1e293b; color: #64748b; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Video panel (left 60%) ── */
  #video-panel {
    width: 60%;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    border-right: 1px solid #334155;
    min-width: 0;
  }
  #video-wrap {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    overflow: hidden;
    min-height: 0;
  }
  #video-wrap video {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
  #video-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #video-controls button {
    background: #334155;
    color: #e2e8f0;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  #video-controls button:hover { background: #475569; }
  #video-controls button.active { background: #2563eb; color: #fff; }
  #seek-bar {
    flex: 1;
    cursor: pointer;
    accent-color: #2563eb;
  }
  #time-display {
    font-size: 0.75rem;
    color: #94a3b8;
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
  }

  /* ── Events panel (right 40%) ── */
  #events-panel {
    width: 40%;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 8px;
    min-width: 0;
  }
  #filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .filter-btn {
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .filter-btn.on { opacity: 1; border-color: currentColor; }
  #show-future-btn {
    margin-left: auto;
    background: #334155;
    color: #94a3b8;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.7rem;
    cursor: pointer;
  }
  #show-future-btn.on { color: #60a5fa; }

  #events-log {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    font-size: 0.75rem;
  }
  .event-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 4px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .event-row:hover { background: #1e293b; }
  .event-row.future { opacity: 0.35; }
  .event-row.future.show-future { opacity: 0.35; }
  .event-row.future.hide-future { display: none; }
  .event-row.current { background: #1e3a5f; }
  .event-time { color: #64748b; min-width: 48px; text-align: right; flex-shrink: 0; }
  .event-badge {
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .event-data { color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Event detail popup ── */
  #event-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #event-popup-overlay.open { display: flex; }
  #event-popup {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 8px;
    max-width: 560px;
    width: 90%;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #event-popup-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  #event-popup-header .event-badge { font-size: 0.75rem; }
  #event-popup-header .popup-title { flex: 1; font-size: 0.85rem; font-weight: 600; }
  #event-popup-header .popup-time { font-size: 0.8rem; color: #64748b; }
  #popup-close-btn {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px;
  }
  #popup-close-btn:hover { color: #e2e8f0; }
  #event-popup-body {
    padding: 12px 16px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  #event-popup-body pre {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.78rem;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
  }
  #event-popup-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid #334155;
    flex-shrink: 0;
  }
  #event-popup-actions button {
    background: #334155;
    color: #e2e8f0;
    border: none;
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  #event-popup-actions button:hover { background: #475569; }
  #event-popup-actions button.copied { background: #065f46; color: #6ee7b7; }
  #event-popup-actions .popup-seek-btn { background: #1e3a8a; color: #93c5fd; }
  #event-popup-actions .popup-seek-btn:hover { background: #1e40af; }

  /* Badge colours per event type */
  .badge-state_change    { background: #78350f; color: #fde68a; }
  .badge-spin_request    { background: #1e3a8a; color: #93c5fd; }
  .badge-spin_result     { background: #064e3b; color: #6ee7b7; }
  .badge-balance_change  { background: #0c4a6e; color: #7dd3fc; }
  .badge-socket_send,
  .badge-socket_recv     { background: #1e293b; color: #9ca3af; }
  .badge-button_state    { background: #312e81; color: #c4b5fd; }
  .badge-free_spin       { background: #7c2d12; color: #fdba74; }
  .badge-bonus_transition { background: #500724; color: #f9a8d4; }
  .badge-popup           { background: #451a03; color: #fcd34d; }
  .badge-error           { background: #450a0a; color: #fca5a5; }
  .badge-default         { background: #334155; color: #e2e8f0; }

  /* ── Step timeline (bottom) ── */
  #timeline-bar {
    flex-shrink: 0;
    padding: 8px 12px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    align-items: center;
  }
  .step-segment {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.7rem;
    cursor: pointer;
    background: #334155;
    color: #e2e8f0;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: background 0.15s;
  }
  .step-segment:hover { background: #475569; }
  .step-segment.active { border-color: #60a5fa; }
  .step-segment.step-pass { background: #065f46; color: #6ee7b7; }
  .step-segment.step-fail { background: #450a0a; color: #fca5a5; }
  .timeline-label { font-size: 0.7rem; color: #475569; margin-right: 4px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="header">
  <h1 id="test-title">Loading…</h1>
  <span class="verdict-badge" id="verdict-badge"></span>
  <span class="meta" id="test-meta"></span>
</div>

<div id="main">

  <div id="video-panel">
    <div id="video-wrap">
      <video id="player" preload="auto"></video>
    </div>
    <div id="video-controls">
      <button id="btn-play">▶</button>
      <input id="seek-bar" type="range" min="0" max="1000" value="0" step="1">
      <span id="time-display">0.0s / 0.0s</span>
      <button id="btn-05" class="speed-btn" data-speed="0.5">0.5×</button>
      <button id="btn-1"  class="speed-btn active" data-speed="1">1×</button>
      <button id="btn-2"  class="speed-btn" data-speed="2">2×</button>
    </div>
  </div>

  <div id="events-panel">
    <div id="filter-bar">
      <!-- Populated dynamically -->
      <button id="show-future-btn">Show future</button>
    </div>
    <div id="events-log"></div>
  </div>

</div>

<div id="timeline-bar">
  <span class="timeline-label">Steps:</span>
  <!-- Populated dynamically -->
</div>

<div id="event-popup-overlay">
  <div id="event-popup">
    <div id="event-popup-header">
      <span class="event-badge" id="popup-badge"></span>
      <span class="popup-title" id="popup-title"></span>
      <span class="popup-time" id="popup-time"></span>
      <button id="popup-close-btn">&times;</button>
    </div>
    <div id="event-popup-body">
      <pre id="popup-json"></pre>
    </div>
    <div id="event-popup-actions">
      <button id="popup-copy-json">Copy JSON</button>
      <button id="popup-copy-data">Copy Data Only</button>
      <button class="popup-seek-btn" id="popup-seek">Seek to Event</button>
    </div>
  </div>
</div>

"action": "script", "description": "Verify stopByWin triggered: payout > 0 and stopped early (remaining = 7)", "detail": "const payout = steps['step-05'].result; const remaining = steps['step-06'].resul...", "success": false, "error": "Error: Cannot read properties of undefined (reading 'result')", "duration_ms": 2}}, {"t": 63.341, "type": "step", "data": {"id": "step-08", "action": "bridge_assert", "description": "Verify spin re-enabled", "detail": "isSpinEnabled == True", "success": false, "error": "window.__gameTestBridge is not registered on the page. Ensure the game URL includes '?bridge=1' and that the bridge has finished initialising before calling bridge methods.", "duration_ms": 2}}, {"t": 63.346, "type": "step", "data": {"id": "step-09", "action": "assert", "description": "AI video: verify auto-spin sequence with stopByWin", "detail": "ai/video", "success": true, "error": null, "duration_ms": 0}}, {"t": 63.35, "type": "step", "data": {"id": "teardown-01", "action": "bridge_action", "description": "", "detail": "resetDevMode()", "success": false, "error": "window.__gameTestBridge is not registered on the page. Ensure the game URL includes '?bridge=1' and that the bridge has finished initialising before calling bridge methods.", "duration_ms": 2}}, {"t": 63.355, "type": "step", "data": {"id": "teardown-02", "action": "bridge_action", "description": "", "detail": "setTurbo(enabled=False)", "success": false, "error": "window.__gameTestBridge is not registered on the page. Ensure the game URL includes '?bridge=1' and that the bridge has finished initialising before calling bridge methods.", "duration_ms": 1}}]};

  // ── Constants ─────────────────────────────────────────────────────────
  const EVENT_BADGES = {
    step:             "STEP",
    state_change:     "STATE",
    spin_request:     "SPIN",
    spin_result:      "RESULT",
    balance_change:   "BAL",
    socket_send:      "SOCKET↑",
    socket_recv:      "SOCKET↓",
    button_state:     "BTN",
    free_spin:        "FREE",
    bonus_transition: "BONUS",
    popup:            "POPUP",
    error:            "ERROR",
  };

  // ── DOM references ────────────────────────────────────────────────────
  const player       = document.getElementById("player");
  const seekBar      = document.getElementById("seek-bar");
  const timeDisplay  = document.getElementById("time-display");
  const btnPlay      = document.getElementById("btn-play");
  const eventsLog    = document.getElementById("events-log");
  const filterBar    = document.getElementById("filter-bar");
  const timelineBar  = document.getElementById("timeline-bar");
  const showFutureBtn = document.getElementById("show-future-btn");

  // ── State ─────────────────────────────────────────────────────────────
  let activeFilters  = new Set();  // types currently shown; empty = show all
  let allTypes       = new Set();
  let showFuture     = false;
  let videoDuration  = 0;
  // video_event_offset: seconds between video start and event collection start
  const videoEventOffset = DATA.video_event_offset || 0;

  // ── Init header ───────────────────────────────────────────────────────
  document.getElementById("test-title").textContent =
    DATA.test_id + (DATA.title ? " — " + DATA.title : "");

  const badge = document.getElementById("verdict-badge");
  const v = (DATA.final_verdict || "pending").toLowerCase();
  badge.textContent = v.toUpperCase();
  badge.className = "verdict-badge verdict-" + v;

  const durationS = (DATA.duration_ms || 0) / 1000;
  document.getElementById("test-meta").textContent =
    "bridge=" + DATA.bridge_result + "  ai=" + DATA.ai_result + "  " + durationS.toFixed(1) + "s";

  // ── Video setup ───────────────────────────────────────────────────────
  player.src = DATA.video_file || "session.webm";

  player.addEventListener("loadedmetadata", function () {
    videoDuration = player.duration;
    seekBar.max = Math.round(videoDuration * 100);
    updateTimeDisplay();
    renderStepTimeline();
  });

  player.addEventListener("timeupdate", function () {
    seekBar.value = Math.round(player.currentTime * 100);
    updateTimeDisplay();
    syncEventLog();
    updateActiveStep();
  });

  player.addEventListener("ended", function () {
    btnPlay.textContent = "▶";
  });

  // Play / pause
  btnPlay.addEventListener("click", function () {
    if (player.paused) { player.play(); btnPlay.textContent = "⏸"; }
    else               { player.pause(); btnPlay.textContent = "▶"; }
  });

  // Seek bar
  seekBar.addEventListener("input", function () {
    player.currentTime = seekBar.value / 100;
    syncEventLog();
    updateActiveStep();
  });

  // Speed buttons
  document.querySelectorAll(".speed-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".speed-btn").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      player.playbackRate = parseFloat(btn.dataset.speed);
    });
  });

  // ── Event log rendering ────────────────────────────────────────────────
  const events = DATA.events || [];

  // Collect all event types
  events.forEach(function (ev) { allTypes.add(ev.type); });

  // Render filter buttons
  function buildFilterBar() {
    // Remove old filter buttons (keep show-future)
    filterBar.querySelectorAll(".filter-btn").forEach(function (b) { b.remove(); });
    const sorted = Array.from(allTypes).sort();
    sorted.forEach(function (type) {
      const btn = document.createElement("button");
      btn.className = "filter-btn " + (activeFilters.has(type) ? "on" : "");
      const label = EVENT_BADGES[type] || type.toUpperCase().replace(/_/g, "-");
      btn.textContent = label;
      const typeClass = "badge-" + type;
      btn.style.cssText =
        "background:" + (getBadgeColor(type).bg) + ";color:" + (getBadgeColor(type).fg) + ";";
      btn.addEventListener("click", function () {
        if (activeFilters.has(type)) {
          activeFilters.delete(type);
          btn.classList.remove("on");
        } else {
          activeFilters.add(type);
          btn.classList.add("on");
        }
        renderEventRows();
      });
      filterBar.insertBefore(btn, showFutureBtn);
    });
  }

  function getStepActionColor(action) {
    var map = {
      navigate:       { bg: "#1e3a8a", fg: "#93c5fd", accent: "#3b82f6" },
      wait_for_state: { bg: "#713f12", fg: "#fde68a", accent: "#eab308" },
      bridge_action:  { bg: "#065f46", fg: "#6ee7b7", accent: "#10b981" },
      bridge_assert:  { bg: "#581c87", fg: "#d8b4fe", accent: "#a855f7" },
      capture:        { bg: "#0e7490", fg: "#a5f3fc", accent: "#06b6d4" },
      assert:         { bg: "#9f1239", fg: "#fda4af", accent: "#f43f5e" },
      script:         { bg: "#78350f", fg: "#fde68a", accent: "#f59e0b" },
      click:          { bg: "#065f46", fg: "#6ee7b7", accent: "#10b981" },
      wait_ms:        { bg: "#334155", fg: "#94a3b8", accent: "#64748b" },
    };
    return map[action] || { bg: "#1e40af", fg: "#bfdbfe", accent: "#60a5fa" };
  }

  function getBadgeColor(type) {
    const colorMap = {
      step:             { bg: "#1e40af", fg: "#bfdbfe" },
      state_change:     { bg: "#78350f", fg: "#fde68a" },
      spin_request:     { bg: "#1e3a8a", fg: "#93c5fd" },
      spin_result:      { bg: "#064e3b", fg: "#6ee7b7" },
      balance_change:   { bg: "#0c4a6e", fg: "#7dd3fc" },
      socket_send:      { bg: "#1e293b", fg: "#9ca3af" },
      socket_recv:      { bg: "#1e293b", fg: "#9ca3af" },
      button_state:     { bg: "#312e81", fg: "#c4b5fd" },
      free_spin:        { bg: "#7c2d12", fg: "#fdba74" },
      bonus_transition: { bg: "#500724", fg: "#f9a8d4" },
      popup:            { bg: "#451a03", fg: "#fcd34d" },
      error:            { bg: "#450a0a", fg: "#fca5a5" },
    };
    return colorMap[type] || { bg: "#334155", fg: "#e2e8f0" };
  }

  // Render event rows into the DOM
  const eventRowEls = [];

  function renderEventRows() {
    eventsLog.innerHTML = "";
    eventRowEls.length = 0;

    events.forEach(function (ev, idx) {
      if (activeFilters.size > 0 && !activeFilters.has(ev.type)) return;

      const row = document.createElement("div");
      row.className = "event-row";
      row.dataset.t = ev.t;
      row.dataset.idx = idx;

      // For step events, use action-specific badge and colors
      var badgeText, badgeColor;
      if (ev.type === "step" && ev.data) {
        var action = ev.data.action || "step";
        badgeText = action.toUpperCase();
        badgeColor = getStepActionColor(action);
        // Style the whole row for step events
        row.style.borderLeft = "3px solid " + badgeColor.accent;
        row.style.paddingLeft = "8px";
        if (!ev.data.success) {
          row.style.background = "#1c1017";
        }
      } else {
        badgeText = EVENT_BADGES[ev.type] || ev.type;
        badgeColor = getBadgeColor(ev.type);
      }

      const badge = document.createElement("span");
      badge.className = "event-badge";
      badge.style.background = badgeColor.bg;
      badge.style.color = badgeColor.fg;
      badge.textContent = badgeText;

      const timeSpan = document.createElement("span");
      timeSpan.className = "event-time";
      timeSpan.textContent = ev.t.toFixed(2) + "s";

      const dataSpan = document.createElement("span");
      dataSpan.className = "event-data";
      if (ev.type === "step" && ev.data && !ev.data.success) {
        dataSpan.style.color = "#fca5a5";
      }
      dataSpan.textContent = formatEventData(ev);

      row.appendChild(timeSpan);
      row.appendChild(badge);
      row.appendChild(dataSpan);

      // Click event row -> open detail popup
      row.addEventListener("click", function () {
        openEventPopup(ev);
      });

      eventsLog.appendChild(row);
      eventRowEls.push({ el: row, t: ev.t });
    });

    syncEventLog();
  }

  function formatEventData(ev) {
    var data = ev.data;
    if (!data) return "";

    // Format step events as readable action lines
    if (ev.type === "step") {
      var icon = data.success ? "\u2713" : "\u2717";
      var line = icon + " " + (data.action || "") + " " + (data.description || "");
      if (data.detail) line += "  " + data.detail;
      if (data.error) line += "  ERR: " + data.error;
      if (data.duration_ms != null) line += "  (" + data.duration_ms + "ms)";
      return line;
    }

    const parts = [];
    for (const [k, v] of Object.entries(data)) {
      parts.push(k + "=" + JSON.stringify(v));
    }
    return parts.join("  ");
  }

  // Sync event row visibility with current video time
  function syncEventLog() {
    const videoT = player.currentTime;
    // Event timestamp relative to collection start; video time includes offset
    const currentEventT = videoT - videoEventOffset;

    let lastVisible = null;
    eventRowEls.forEach(function (item) {
      const evT = parseFloat(item.el.dataset.t);
      const isFuture = evT > currentEventT;
      item.el.classList.remove("future", "current");
      if (isFuture) {
        item.el.classList.add("future");
        if (showFuture) {
          item.el.classList.remove("hide-future");
          item.el.classList.add("show-future");
        } else {
          item.el.classList.remove("show-future");
          item.el.classList.add("hide-future");
        }
      } else {
        lastVisible = item.el;
      }
    });

    // Scroll to latest visible event
    if (lastVisible) {
      lastVisible.classList.add("current");
      lastVisible.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  // ── Show future toggle ─────────────────────────────────────────────────
  showFutureBtn.addEventListener("click", function () {
    showFuture = !showFuture;
    showFutureBtn.classList.toggle("on", showFuture);
    syncEventLog();
  });

  // ── Step timeline ──────────────────────────────────────────────────────
  const steps = DATA.steps || [];
  const stepSegments = [];

  function renderStepTimeline() {
    // Remove old segments (keep label)
    timelineBar.querySelectorAll(".step-segment").forEach(function (s) { s.remove(); });
    stepSegments.length = 0;

    steps.forEach(function (step) {
      const seg = document.createElement("button");
      seg.className = "step-segment";
      seg.textContent = step.id || step.action;
      seg.title = step.id + " (" + step.action + ")" +
        (step.description ? "\n" + step.description : "") +
        "\n" + step.start_ms + "ms – " + step.end_ms + "ms";

      // Click step -> seek video to step start
      seg.addEventListener("click", function () {
        // step.start_ms is relative to test start; convert to video time
        const stepStartS = step.start_ms / 1000 + videoEventOffset;
        player.currentTime = Math.max(0, stepStartS);
        syncEventLog();
        updateActiveStep();
      });

      timelineBar.appendChild(seg);
      stepSegments.push({ el: seg, step: step });
    });
  }

  function updateActiveStep() {
    const videoT = player.currentTime;
    const eventT = (videoT - videoEventOffset) * 1000; // ms

    stepSegments.forEach(function (item) {
      const s = item.step;
      const active = eventT >= s.start_ms && eventT <= s.end_ms;
      item.el.classList.toggle("active", active);
    });
  }

  function updateTimeDisplay() {
    const cur = player.currentTime || 0;
    const dur = videoDuration || 0;
    timeDisplay.textContent = cur.toFixed(1) + "s / " + dur.toFixed(1) + "s";
  }

  // ── Event detail popup ─────────────────────────────────────────────
  const popupOverlay  = document.getElementById("event-popup-overlay");
  const popupBadge    = document.getElementById("popup-badge");
  const popupTitle    = document.getElementById("popup-title");
  const popupTime     = document.getElementById("popup-time");
  const popupJson     = document.getElementById("popup-json");
  const popupCloseBtn = document.getElementById("popup-close-btn");
  const popupCopyJson = document.getElementById("popup-copy-json");
  const popupCopyData = document.getElementById("popup-copy-data");
  const popupSeek     = document.getElementById("popup-seek");
  let currentPopupEvent = null;

  function openEventPopup(ev) {
    currentPopupEvent = ev;

    // Badge
    var badgeText, badgeColor;
    if (ev.type === "step" && ev.data) {
      badgeText = (ev.data.action || "step").toUpperCase();
      badgeColor = getStepActionColor(ev.data.action || "step");
    } else {
      badgeText = EVENT_BADGES[ev.type] || ev.type;
      badgeColor = getBadgeColor(ev.type);
    }
    popupBadge.textContent = badgeText;
    popupBadge.style.background = badgeColor.bg;
    popupBadge.style.color = badgeColor.fg;

    // Title
    if (ev.type === "step" && ev.data) {
      popupTitle.textContent = (ev.data.id || "") + " — " + (ev.data.description || ev.data.action || "");
    } else {
      popupTitle.textContent = ev.type.replace(/_/g, " ");
    }

    // Time
    popupTime.textContent = ev.t.toFixed(3) + "s";

    // JSON body — formatted
    popupJson.textContent = JSON.stringify(ev, null, 2);

    popupOverlay.classList.add("open");
  }

  function closeEventPopup() {
    popupOverlay.classList.remove("open");
    currentPopupEvent = null;
    popupCopyJson.textContent = "Copy JSON";
    popupCopyJson.classList.remove("copied");
    popupCopyData.textContent = "Copy Data Only";
    popupCopyData.classList.remove("copied");
  }

  popupCloseBtn.addEventListener("click", closeEventPopup);

  // Close on overlay click (outside popup)
  popupOverlay.addEventListener("click", function (e) {
    if (e.target === popupOverlay) closeEventPopup();
  });

  // Close on Escape
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && popupOverlay.classList.contains("open")) {
      closeEventPopup();
    }
  });

  // Copy full event JSON
  popupCopyJson.addEventListener("click", function () {
    if (!currentPopupEvent) return;
    var text = JSON.stringify(currentPopupEvent, null, 2);
    navigator.clipboard.writeText(text).then(function () {
      popupCopyJson.textContent = "Copied!";
      popupCopyJson.classList.add("copied");
      setTimeout(function () {
        popupCopyJson.textContent = "Copy JSON";
        popupCopyJson.classList.remove("copied");
      }, 1500);
    });
  });

  // Copy data only
  popupCopyData.addEventListener("click", function () {
    if (!currentPopupEvent || !currentPopupEvent.data) return;
    var text = JSON.stringify(currentPopupEvent.data, null, 2);
    navigator.clipboard.writeText(text).then(function () {
      popupCopyData.textContent = "Copied!";
      popupCopyData.classList.add("copied");
      setTimeout(function () {
        popupCopyData.textContent = "Copy Data Only";
        popupCopyData.classList.remove("copied");
      }, 1500);
    });
  });

  // Seek to event time
  popupSeek.addEventListener("click", function () {
    if (!currentPopupEvent) return;
    var videoT = currentPopupEvent.t + videoEventOffset;
    player.currentTime = Math.max(0, videoT);
    syncEventLog();
    updateActiveStep();
    closeEventPopup();
  });

  // ── Boot ───────────────────────────────────────────────────────────────
  buildFilterBar();
  renderEventRows();
  renderStepTimeline();

})();
</script>
</body>
</html>
